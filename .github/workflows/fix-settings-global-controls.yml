name: Fix settings global controls

on:
  push:
    paths:
      - '.github/workflows/fix-settings-global-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared header geometry to settings panel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import re

          css_path = Path('assets/control-sizing.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* settings-global-header-contract-v1 */'
          payload = ''
          rules = base64.b64decode(payload).decode('utf-8')
          if marker not in css:
              css += '\n' + rules
              css_path.write_text(css, encoding='utf-8')

          version = hashlib.sha256(css.encode()).hexdigest()[:12]
          style_pattern = re.compile(r'(assets/control-sizing\.css)\?v=[0-9a-f]+')
          outline_pattern = re.compile(r'[ \t]*<svg\b(?=[^>]*\bclass="[^"]*\bsettings-outline\b)[^>]*>[\s\S]*?</svg>[ \t]*(?:\r?\n)?')
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = outline_pattern.sub('', text)
              updated = style_pattern.sub(rf'\1?v={version}', updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/fix-settings-global-controls.yml').unlink()
          print(version)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify settings menu with header controls'
          git push
