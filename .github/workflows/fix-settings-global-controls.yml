name: Fix settings global controls

on:
  push:
    paths:
      - '.github/workflows/fix-settings-global-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared header geometry to settings panel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          css_path = Path('assets/control-sizing.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* settings-global-header-contract-v1 */'
          rules = r'''

/* settings-global-header-contract-v1 */
/* Settings consume the same geometry contract as the header controls. */
:root .header-actions {
  --settings-cell: var(--header-control-size);
  --settings-gap: var(--header-control-gap);
  --settings-padding: var(--header-control-half-gap);
  --settings-color-width: var(--header-control-size);
  --settings-color-height: auto;
  --settings-layout-width: max-content;
  --settings-layout-height: auto;
  inset-inline-end: calc(0px - var(--header-control-half-gap) - var(--settings-padding));
  inset-block-start: calc(100% + var(--header-control-half-gap) - var(--settings-padding));
  inline-size: max-content;
  min-inline-size: 0;
  padding: var(--settings-padding);
  gap: 0;
  border: 0;
  border-radius: var(--control-radius);
  background: transparent;
  box-shadow: none;
  isolation: isolate;
}
:root .header-actions > .settings-outline { display: none; }
:root .header-actions::before {
  content: "";
  position: absolute;
  z-index: 0;
  inset: 0;
  border: 1px solid var(--line-dark);
  border-radius: var(--control-radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  pointer-events: none;
}
:root .header-actions > * { position: relative; z-index: 1; }
:root .settings-lower {
  display: grid;
  grid-template-columns: repeat(3, var(--header-control-size));
  grid-template-rows: repeat(2, var(--header-control-size));
  gap: var(--header-control-gap);
  inline-size: max-content;
  block-size: auto;
  align-items: stretch;
  justify-items: stretch;
  direction: ltr;
}
:root .settings-lower > .updates-controls { display: contents; }
:root .settings-lower > .updates-controls > :first-child { grid-column: 1; grid-row: 1; }
:root .settings-lower > .updates-controls > :nth-child(2) { grid-column: 2; grid-row: 1; }
:root .settings-lower > .random-post { grid-column: 1; grid-row: 2; }
:root .settings-lower > .theme-toggle { grid-column: 2; grid-row: 2; }
:root .settings-lower > .color-settings {
  grid-column: 3;
  grid-row: 1 / 3;
  align-self: stretch;
  inline-size: var(--header-control-size);
  block-size: auto;
  width: var(--header-control-size);
  height: auto;
  min-height: 0;
  max-height: none;
}
:root .header-actions :is(.settings-action, .random-post, .theme-toggle, .accent-picker, .accent-reset) {
  box-sizing: border-box;
  inline-size: var(--header-control-size);
  min-inline-size: var(--header-control-size);
  max-inline-size: var(--header-control-size);
  block-size: var(--header-control-size);
  min-block-size: var(--header-control-size);
  max-block-size: var(--header-control-size);
  width: var(--header-control-size);
  min-width: var(--header-control-size);
  max-width: var(--header-control-size);
  height: var(--header-control-size);
  min-height: var(--header-control-size);
  max-height: var(--header-control-size);
  flex: 0 0 var(--header-control-size);
  padding: var(--header-control-padding);
  border-radius: var(--control-radius);
}
:root :is(.settings-toggle, .header-actions .settings-action, .header-actions .random-post, .header-actions .theme-toggle, .header-actions .accent-reset) > svg {
  inline-size: var(--control-icon-size);
  block-size: var(--control-icon-size);
  width: var(--control-icon-size);
  height: var(--control-icon-size);
}
:root .header-actions .accent-control { display: none; }
:root .header-actions .accent-panel {
  position: absolute;
  inset: 0;
  z-index: 1;
  box-sizing: border-box;
  display: none;
  grid-template-rows: repeat(2, var(--header-control-size));
  gap: var(--header-control-gap);
  width: auto;
  height: auto;
  padding: 0;
  border: 0;
  border-radius: var(--control-radius);
  background: var(--surface);
  box-shadow: none;
  overflow: hidden;
}
:root .header-actions .color-settings[open] > .accent-panel { display: grid; }
:root .header-actions .accent-panel::after {
  content: "";
  position: absolute;
  z-index: 2;
  inset: 0;
  border: 1px solid var(--line-dark);
  border-radius: inherit;
  pointer-events: none;
}
:root .header-actions .accent-panel > * { border-color: transparent; }
:root .header-actions .accent-picker::-webkit-color-swatch { border-radius: var(--control-inner-radius); }
:root .header-actions .accent-picker::-moz-color-swatch { border-radius: var(--control-inner-radius); }
'''

          if marker not in css:
              css += rules
              css_path.write_text(css, encoding='utf-8')

          version = hashlib.sha256(css.encode()).hexdigest()[:12]
          style_pattern = re.compile(r'(assets/control-sizing\.css)\?v=[0-9a-f]+')
          outline_pattern = re.compile(
              r'[ \t]*<svg\b(?=[^>]*\bclass="[^"]*\bsettings-outline\b)[^>]*>[\s\S]*?</svg>[ \t]*(?:\r?\n)?'
          )
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = outline_pattern.sub('', text)
              updated = style_pattern.sub(rf'\1?v={version}', updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/fix-settings-global-controls.yml').unlink()
          print(version)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify settings menu with header controls'
          git push
