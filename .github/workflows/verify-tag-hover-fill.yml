name: Verify tag hover fill

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-tag-hover-fill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust generated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'control-sizing.css?v=4698da19e4e3'
          new = 'control-sizing.css?v=5568de927a29'
          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed += 1
          print(f'updated {changed} html files')
          if changed == 0:
              raise SystemExit('expected generated HTML fingerprint updates')
          PY

      - name: Verify shared hover fill rule
        run: |
          set -euo pipefail
          grep -F ':root body .tag-option:not(.is-excluded):not(:has(> .tag-chip[aria-pressed="true"])):is(:hover, :has(:focus-visible)),' assets/control-sizing.css
          grep -F ':root body .tag-chip:not([aria-pressed="true"]):not(.tag-option > .tag-chip):is(:hover, :focus-visible)' assets/control-sizing.css
          grep -F 'background: var(--soft-accent) !important;' assets/control-sizing.css

          rm -rf /tmp/ssm-tag-hover
          mkdir -p /tmp/ssm-tag-hover/ssm
          cp -a . /tmp/ssm-tag-hover/ssm/
          cat > /tmp/ssm-tag-hover/ssm/tag-hover-check.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <link rel="stylesheet" href="/ssm/assets/styles.css">
          <link rel="stylesheet" href="/ssm/assets/post-layout.css">
          <link rel="stylesheet" href="/ssm/assets/control-sizing.css">
          </head><body>
          <div class="tag-option" id="split"><a href="#" class="tag-chip" id="split-chip">Music <span class="tag-count" id="count">3</span></a></div>
          <a href="#" class="tag-chip card-tag" id="standalone">Notes</a>
          <output id="metrics"></output>
          <script>
          addEventListener('load', () => {
            const split = document.querySelector('#split');
            const splitChip = document.querySelector('#split-chip');
            const count = document.querySelector('#count');
            const standalone = document.querySelector('#standalone');
            const out = document.querySelector('#metrics');
            splitChip.focus({focusVisible:true});
            requestAnimationFrame(() => {
              out.dataset.splitFocusVisible = String(splitChip.matches(':focus-visible'));
              out.dataset.splitBg = getComputedStyle(split).backgroundColor;
              out.dataset.countBg = getComputedStyle(count).backgroundColor;
              standalone.focus({focusVisible:true});
              requestAnimationFrame(() => {
                out.dataset.standaloneFocusVisible = String(standalone.matches(':focus-visible'));
                out.dataset.standaloneBg = getComputedStyle(standalone).backgroundColor;
                out.dataset.softAccent = getComputedStyle(document.documentElement).getPropertyValue('--soft-accent').trim();
              });
            });
          });
          </script></body></html>
          HTML
          cd /tmp/ssm-tag-hover
          python3 -m http.server 8765 >/tmp/ssm-tag-hover-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=1500 --dump-dom http://127.0.0.1:8765/ssm/tag-hover-check.html > /tmp/ssm-tag-hover-dom.html
          python3 - <<'PY'
          import html, re
          from pathlib import Path
          dom = Path('/tmp/ssm-tag-hover-dom.html').read_text(encoding='utf-8')
          m = re.search(r'<output id="metrics"([^>]*)>', dom)
          if not m: raise SystemExit('missing metrics')
          attrs = {k: html.unescape(v) for k,v in re.findall(r'data-([a-z-]+)="([^"]*)"', m.group(1))}
          print('tag hover/focus metrics:', attrs)
          assert attrs['split-focus-visible'] == 'true', attrs
          assert attrs['standalone-focus-visible'] == 'true', attrs
          assert attrs['split-bg'] == attrs['count-bg'], attrs
          assert attrs['standalone-bg'] == attrs['count-bg'], attrs
          PY

      - name: Commit cache-bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No fingerprint changes to commit.'
          else
            git commit -m 'Cache-bust tag hover fill'
            git push
          fi
