name: Fix post row spacing

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/fix-post-row-spacing.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore post row geometry and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          styles_path = Path('assets/styles.css')
          css = styles_path.read_text()
          bad = ''':root .post-stream {
            gap: var(--interface-gap) !important;
          }
          '''
          if bad not in css:
              # tolerate formatting without indentation from previous generated patch
              css2 = re.sub(r':root \.post-stream\s*\{\s*gap:\s*var\(--interface-gap\)\s*!important;\s*\}\s*', '', css, count=1)
          else:
              css2 = css.replace(bad, '', 1)
          css2 = css2.replace(
              'rule-to-tags, inter-control/inter-tag spacing, tags-to-rule, rule-to-posts,\n   and the spacing between adjacent post cards.',
              'rule-to-tags, inter-control/inter-tag spacing, and tag-row edge spacing.'
          )
          if css2 != css:
              styles_path.write_text(css2)

          post_layout = Path('assets/post-layout.css').read_text()
          required_layout = (
              '--post-row-gap: 2.45rem;',
              '--directory-row-gap: 1rem;',
              'row-gap: var(--post-row-gap);',
              'margin-block-end: calc(var(--directory-row-gap) - var(--post-row-gap));',
          )
          for rule in required_layout:
              if rule not in post_layout:
                  raise SystemExit(f'Missing post spacing rule: {rule}')
          if re.search(r':root \.post-stream\s*\{[^}]*gap:\s*var\(--interface-gap\)', styles_path.read_text(), re.S):
              raise SystemExit('Global interface gap still overrides post row spacing')

          digest = hashlib.sha256(styles_path.read_bytes()).hexdigest()[:12]
          pattern = re.compile(r'(/ssm/assets/styles\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = pattern.sub(rf'\1?v={digest}', text)
              if updated != text:
                  html.write_text(updated)
                  changed += 1
          sample = Path('en/index.html').read_text()
          if f'/ssm/assets/styles.css?v={digest}' not in sample:
              raise SystemExit('Homepage did not receive refreshed styles hash')
          print(f'Updated {changed} HTML files; styles={digest}')
          PY
            git add assets/styles.css '*.html' 'en/**/*.html' 'he/**/*.html'
            if git diff --cached --quiet; then
              echo "Live site already current."
              exit 0
            fi
            git commit -m "Restore normal post spacing and compact Directory gap"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent Pages update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
