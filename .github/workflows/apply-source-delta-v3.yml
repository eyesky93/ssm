name: Apply validated source delta v3

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-source-delta-v3.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install robust generated-tree verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_source_delta_1d149eed.py')
          text = path.read_text()
          marker = '# Structural checks on the generated tree.'
          if marker not in text:
              raise SystemExit('Structural-check marker missing')
          head = text.split(marker, 1)[0]
          checks = r'''# Structural checks on the generated tree.
          post_pages = [p for p in Path('.').glob('*/posts/*/index.html') if 'newsletter' not in str(p)]
          if not post_pages:
              raise SystemExit('No post pages found')
          for path in post_pages:
              html = path.read_text()
              if 'data-reader-article' not in html:
                  continue
              article_open = re.search(r'<article class="article-shell"[^>]*\bdata-reader-article\b[^>]*>', html)
              if not article_open:
                  raise SystemExit(f'Missing reader article in {path}')
              if '<header class="site-header">' not in html or '</header>' not in html:
                  raise SystemExit(f'Missing site header in {path}')
              site_header = html.split('<header class="site-header">', 1)[1].split('</header>', 1)[0]
              if 'data-article-actions' not in site_header:
                  raise SystemExit(f'Missing header actions in {path}')
              if 'data-directory' not in article_open.group(0) and 'data-read-toggle' not in site_header:
                  raise SystemExit(f'Missing header read control in {path}')
          print(f'Patched assets and {changed_html} HTML files; hashes={asset_hash}')
          '''
          # Dedent the literal embedded above without importing anything else.
          lines = checks.splitlines()
          indent = min((len(line) - len(line.lstrip()) for line in lines if line.strip()), default=0)
          checks = '\n'.join(line[indent:] for line in lines) + '\n'
          path.write_text(head + checks)
          PY

      - name: Apply validated source changes to generated Pages tree
        run: python .github/scripts/apply_source_delta_1d149eed.py

      - name: Commit generated public update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Generated Pages tree is already current."
            exit 0
          fi
          git commit -m "Publish compact shared tags and reader header actions"
          git push origin HEAD:master
