name: Fix reader title-tag separation

on:
  push:
    paths:
      - '.github/workflows/fix-reader-heading-separation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reader heading separation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          css_path = Path('assets/post-layout.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Reader title/tag hard separation: generated-site live invariant. */'
          rule = r'''

/* Reader title/tag hard separation: generated-site live invariant. */
:root .article-heading.post-heading > .post-tools {
  min-width: 0;
  max-width: none;
  overflow: hidden;
}
:root .article-heading .article-tags {
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  flex: 1 1 auto;
  flex-wrap: nowrap;
  justify-content: flex-start;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-inline: contain;
  scrollbar-width: none;
  padding: 3px;
  margin: 0;
}
:root .article-heading .article-tags::-webkit-scrollbar { display: none; }
:root .article-heading .article-tags > :not([hidden]) {
  min-width: max-content;
  max-width: none;
  flex: 0 0 auto;
  white-space: nowrap;
}
:root .article-heading .article-tags > :nth-child(1 of :not([hidden])) {
  margin-inline-start: auto;
}
@media (min-width: 701px) {
  :root .article-heading.post-heading {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    align-items: start;
    column-gap: 1.5rem;
  }
  :root .article-heading.post-heading > h1 {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  :root .article-heading.post-heading > .post-tools {
    grid-column: 2;
    grid-row: 1;
    width: 100%;
    min-width: 0;
    align-items: flex-start;
  }
}
'''
          if marker not in css:
              css += rule
              css_path.write_text(css, encoding='utf-8')

          version = hashlib.sha256(css.encode()).hexdigest()[:12]
          pattern = re.compile(r'(assets/post-layout\.css)\?v=[0-9a-f]+')
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = pattern.sub(rf'\1?v={version}', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/fix-reader-heading-separation.yml').unlink()
          print(version)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep reader title and tags separated'
          git push
