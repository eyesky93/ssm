name: Deploy mobile presentation fixes

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-mobile-header-controls.yml"

permissions:
  contents: write

concurrency:
  group: ssm-mobile-presentation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current Pages tree and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('assets/control-sizing.css')
          css = path.read_text()

          marker = '/* mobile-header-controls-v1 */'
          block = r'''
          /* mobile-header-controls-v1 */
          /* Desktop deliberately keeps the compact header family. Phones restore
             the full shared control size; search, language, settings and the
             settings popup all consume the same header aliases. */
          :root {
            --mobile-header-control-size: var(--control-size);
            --mobile-header-control-gap: var(--control-capsule-gap);
          }
          @media (max-width: 700px) {
            :root body .header-controls {
              --header-control-size: var(--mobile-header-control-size);
              --header-control-inner-size: calc(var(--mobile-header-control-size) - 2px);
              --header-control-padding: max(0px, calc((var(--mobile-header-control-size) - var(--control-icon-size) - 2px) / 2));
              --header-control-gap: var(--mobile-header-control-gap) !important;
              --header-control-half-gap: calc(var(--mobile-header-control-gap) / 2) !important;
              gap: var(--header-control-gap) !important;
            }
            :root body .header-controls .site-search,
            :root body .header-controls .search-shell,
            :root body .header-controls .search-bar,
            :root body .header-controls .toolbar-view,
            :root body .header-controls .toolbar-view > .view-switch {
              height: var(--header-control-size);
              min-height: var(--header-control-size);
              max-height: var(--header-control-size);
            }
          }
          '''
          if marker not in css:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'

          brand_marker = '/* mobile-wordmark-controls-v1 */'
          brand_block = r'''
          /* mobile-wordmark-controls-v1 */
          /* Mobile wordmark geometry follows the same enlarged header family.
             Desktop keeps its compact brand frame unchanged. */
          :root {
            --mobile-wordmark-size: var(--mobile-header-control-size);
            --mobile-wordmark-padding-inline: calc(2 * var(--mobile-header-control-gap));
            --mobile-wordmark-radius: var(--control-radius);
          }
          @media (max-width: 700px) {
            :root body .wordmark {
              min-height: var(--mobile-wordmark-size) !important;
              height: var(--mobile-wordmark-size) !important;
              padding-block: 0 !important;
              padding-inline: var(--mobile-wordmark-padding-inline) !important;
              border-radius: var(--mobile-wordmark-radius) !important;
            }
          }
          '''
          if brand_marker not in css:
              css = css.rstrip() + '\n\n' + brand_block.strip() + '\n'

          layout_marker = '/* mobile-header-layout-v2 */'
          layout_block = r'''
          /* mobile-header-layout-v2 */
          /* One mobile geometry contract aligns the brand/navigation row. */
          :root {
            --mobile-header-group-gap: var(--mobile-header-control-gap);
            --mobile-settings-panel-gap: var(--mobile-header-control-gap);
          }
          @media (max-width: 700px) {
            :root body .site-header {
              align-items: center;
              flex-wrap: nowrap;
              gap: var(--mobile-header-group-gap);
            }
            :root body .primary-nav {
              flex: 1 1 auto;
              min-width: 0;
              gap: var(--mobile-header-group-gap);
              align-items: center;
            }
            :root body .primary-nav .about-link { white-space: nowrap; }
            :root body .header-controls {
              flex: 0 0 auto;
              flex-wrap: nowrap;
              min-width: 0;
              align-items: center;
              margin-inline-start: 0;
            }
            :root body .header-settings {
              flex: 0 0 var(--header-control-size);
              inline-size: var(--header-control-size);
              block-size: var(--header-control-size);
            }
            :root body .wordmark { flex: 0 0 auto; }
          }
          '''
          if layout_marker not in css:
              css = css.rstrip() + '\n\n' + layout_block.strip() + '\n'

          overlay_marker = '/* mobile-header-overlay-v3 */'
          overlay_block = r'''
          /* mobile-header-overlay-v3 */
          /* Settings is a true popover: it overlays page content without changing
             header or tag-menu geometry. Every icon consumes one centering model. */
          :root {
            --mobile-settings-panel-z: 60;
          }
          @media (max-width: 700px) {
            :root body .site-header {
              position: relative;
              overflow: visible;
            }
            :root body .site-header:has(.header-settings[data-open="true"]) {
              padding-block-end: var(--interface-gap, 0px) !important;
            }
            :root body .header-settings .header-actions {
              z-index: var(--mobile-settings-panel-z);
              inset-inline-end: calc(0px - var(--settings-padding));
              inset-block-start: calc(100% + var(--mobile-settings-panel-gap) - var(--settings-padding));
            }
            :root body .header-controls :is(
              .search-toggle,
              .language-nav,
              .language-nav > a,
              .language-nav > select,
              .settings-toggle
            ) {
              align-items: center;
              justify-content: center;
              align-content: center;
              line-height: 1;
            }
            :root body .header-controls :is(.search-toggle, .settings-toggle),
            :root body .header-actions :is(.settings-action, .random-post, .theme-toggle, .accent-reset) {
              display: grid;
              place-items: center;
              align-content: center;
              justify-content: center;
              line-height: 1;
            }
            :root body .header-controls :is(.search-toggle, .settings-toggle) > svg,
            :root body .header-actions :is(.settings-action, .random-post, .theme-toggle, .accent-reset) > svg {
              display: block;
              inline-size: var(--control-icon-size);
              block-size: var(--control-icon-size);
              width: var(--control-icon-size);
              height: var(--control-icon-size);
              margin: 0;
              flex: 0 0 var(--control-icon-size);
            }
          }
          '''
          if overlay_marker not in css:
              css = css.rstrip() + '\n\n' + overlay_block.strip() + '\n'

          theme_marker = '/* mobile-theme-icon-state-v4 */'
          theme_block = r'''
          /* mobile-theme-icon-state-v4 */
          /* Mobile alignment may size theme icons but must not make both states
             visible. Show only the action that switches away from the current theme. */
          @media (max-width: 700px) {
            :root body .header-actions .theme-toggle > [data-theme-icon] {
              display: none;
              inline-size: var(--control-icon-size);
              block-size: var(--control-icon-size);
              width: var(--control-icon-size);
              height: var(--control-icon-size);
              margin: 0;
              flex: 0 0 var(--control-icon-size);
            }
            :root[data-theme="light"] body .header-actions .theme-toggle > [data-theme-icon="dark"],
            :root[data-theme="dark"] body .header-actions .theme-toggle > [data-theme-icon="light"] {
              display: block;
            }
          }
          '''
          if theme_marker not in css:
              css = css.rstrip() + '\n\n' + theme_block.strip() + '\n'

          path.write_text(css)
          control_digest = hashlib.sha256(path.read_bytes()).hexdigest()[:12]

          post_path = Path('assets/post-layout.css')
          post_css = post_path.read_text()
          card_marker = '/* mobile-card-tag-flow-v1 */'
          card_block = r'''
          /* mobile-card-tag-flow-v1 */
          /* Phones use one semantic flow regardless of the persisted desktop
             layout choice: title, subtitle, tags, then footer/actions. */
          @media (max-width: 700px) {
            :root .post-stream[data-layout] .post-card:not(.directory-card) > .post-heading {
              display: contents;
            }
            :root .post-stream[data-layout] .post-heading > h2 {
              order: 0;
              margin-block: 0 var(--card-content-gap);
            }
            :root .post-stream[data-layout] .post-card:not(.directory-card) > p {
              order: 1;
              margin-block: 0;
            }
            :root .post-stream[data-layout] .post-tools {
              order: 2;
              justify-content: flex-start;
              margin-block-start: var(--card-content-gap);
            }
            :root .post-stream[data-layout] .card-tags > :nth-child(1 of :not([hidden])) {
              margin-inline-start: 0;
            }
            :root .post-stream[data-layout] .card-footer {
              order: 3;
            }
          }
          '''
          if card_marker not in post_css:
              post_css = post_css.rstrip() + '\n\n' + card_block.strip() + '\n'
          post_path.write_text(post_css)
          post_digest = hashlib.sha256(post_path.read_bytes()).hexdigest()[:12]

          control_pattern = re.compile(r'(/ssm/assets/control-sizing\.css)\?v=[0-9a-f]+')
          post_pattern = re.compile(r'(/ssm/assets/post-layout\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = control_pattern.sub(rf'\1?v={control_digest}', text)
              updated = post_pattern.sub(rf'\1?v={post_digest}', updated)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          sample = Path('en/index.html').read_text()
          if f'/ssm/assets/control-sizing.css?v={control_digest}' not in sample:
              raise SystemExit('Homepage did not receive refreshed control stylesheet hash')
          if f'/ssm/assets/post-layout.css?v={post_digest}' not in sample:
              raise SystemExit('Homepage did not receive refreshed post-layout stylesheet hash')
          final = path.read_text()
          for required in (
              marker,
              '--mobile-header-control-size:',
              brand_marker,
              '--mobile-wordmark-size:',
              layout_marker,
              overlay_marker,
              '--mobile-settings-panel-z:',
              'padding-block-end: var(--interface-gap, 0px) !important',
              theme_marker,
              '[data-theme-icon="dark"]',
              '[data-theme-icon="light"]',
          ):
              if required not in final:
                  raise SystemExit(f'Missing mobile control rule: {required}')
          final_post = post_path.read_text()
          for required in (
              card_marker,
              '.post-card:not(.directory-card) > .post-heading',
              '.post-card:not(.directory-card) > p',
              '.post-tools',
              '.card-footer',
          ):
              if required not in final_post:
                  raise SystemExit(f'Missing mobile card-flow rule: {required}')
          print(f'Updated {changed} HTML files; control-sizing={control_digest}; post-layout={post_digest}')
          PY
            git add assets/control-sizing.css assets/post-layout.css '*.html' 'en/**/*.html' 'he/**/*.html'
            if git diff --cached --quiet; then
              echo "Live site already current."
              exit 0
            fi
            git commit -m "Publish mobile tags below subtitles"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent Pages update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
