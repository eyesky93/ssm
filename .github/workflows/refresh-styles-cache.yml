name: Refresh stylesheet cache key

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/refresh-styles-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update generated HTML stylesheet version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          stylesheet = Path('assets/styles.css')
          version = hashlib.sha256(stylesheet.read_bytes()).hexdigest()[:12]
          pattern = re.compile(r'(/ssm/assets/styles\.css\?v=)[0-9a-f]+')
          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(rf'\g<1>{version}', text)
              if count and updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          print(f'Updated stylesheet cache key in {changed} HTML files to {version}.')
          PY
      - name: Commit refreshed cache key
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML cache-key changes were needed."
            exit 0
          fi
          git commit -m "Refresh SSM stylesheet cache key"
          git push origin HEAD:master
