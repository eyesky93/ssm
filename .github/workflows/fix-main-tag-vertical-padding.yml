name: Fix main tag menu vertical padding

on:
  push:
    paths:
      - '.github/workflows/fix-main-tag-vertical-padding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten main tag menu vertical padding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          css_path = Path('assets/control-sizing.css')
          css = css_path.read_text(encoding='utf-8')
          anchor = ':root .home-main .browser-toolbar .subject-nav {'
          start = css.index(anchor)
          end = css.index('\n}', start) + 2
          marker = '/* Main menu block padding must override the desktop browser-toolbar rule. */'
          rule = ('\n\n/* Main menu block padding must override the desktop browser-toolbar rule. */\n'
                  ':root .home-main .browser-toolbar .subject-nav .tag-option > .tag-chip,\n'
                  ':root .home-main .browser-toolbar .subject-nav .tag-option > .tag-chip:is(:hover, :focus-visible) {\n'
                  '  padding-block: var(--tag-capsule-padding-block) !important;\n'
                  '  min-height: var(--tag-capsule-inner-size);\n'
                  '}\n')
          if marker not in css:
              css = css[:end] + rule + css[end:]
          css_path.write_text(css, encoding='utf-8')

          version = hashlib.sha256(css.encode()).hexdigest()[:12]
          pattern = re.compile(r'(assets/control-sizing\.css)\?v=[0-9a-f]+')
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = pattern.sub(rf'\1?v={version}', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/fix-main-tag-vertical-padding.yml').unlink()
          print(version)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply main tag menu vertical padding'
          git push
