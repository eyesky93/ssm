name: Refresh control sizing cache

on:
  push:
    paths:
      - '.github/workflows/refresh-control-sizing-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh generated HTML cache keys
        shell: bash
        run: |
          set -euo pipefail
          version="$(sha256sum assets/control-sizing.css | cut -c1-12)"
          while IFS= read -r -d '' file; do
            sed -E -i "s#(assets/control-sizing\.css)\?v=[0-9a-f]+#\1?v=${version}#g" "$file"
          done < <(find . -type f -name '*.html' -print0)
          rm -f .github/workflows/refresh-control-sizing-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cache-key changes needed.'
            exit 0
          fi
          git commit -m "Refresh control-sizing asset cache key"
          git push
