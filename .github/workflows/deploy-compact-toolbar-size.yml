name: Deploy compact toolbar size

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-compact-toolbar-size.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current Pages tree and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('assets/control-sizing.css')
          css = path.read_text()
          marker = '/* shared-compact-toolbar-control-size-v1 */'
          block = r'''
          /* shared-compact-toolbar-control-size-v1 */
          /* Header toolbar controls and the tag-row reset are one compact control
             family. Change the shared token once; every member follows it. */
          :root {
            --compact-control-size: var(--tag-capsule-size);
          }
          :root .header-controls {
            --header-control-size: var(--compact-control-size);
            --header-control-inner-size: calc(var(--header-control-size) - 2px);
            --header-control-padding: max(0px, calc((var(--header-control-size) - var(--control-icon-size) - 2px) / 2));
          }

          :root .subject-nav :is(.clear-filter, .filter-reset-slot) {
            width: var(--compact-control-size);
            min-width: var(--compact-control-size);
            max-width: var(--compact-control-size);
            height: var(--compact-control-size);
            min-height: var(--compact-control-size);
            max-height: var(--compact-control-size);
            inline-size: var(--compact-control-size);
            min-inline-size: var(--compact-control-size);
            max-inline-size: var(--compact-control-size);
            block-size: var(--compact-control-size);
            min-block-size: var(--compact-control-size);
            max-block-size: var(--compact-control-size);
            flex-basis: var(--compact-control-size);
          }

          :root .header-controls :is(
            .settings-toggle,
            .round-control,
            .pin-toggle:where(:not(.quiet-control)),
            .share-menu summary:where(:not(.quiet-control)),
            .language-nav,
            .language-nav > a,
            .language-nav > select,
            .toolbar-view .view-switch > button
          ) {
            box-sizing: border-box;
            width: var(--header-control-size);
            min-width: var(--header-control-size);
            max-width: var(--header-control-size);
            height: var(--header-control-size);
            min-height: var(--header-control-size);
            max-height: var(--header-control-size);
            inline-size: var(--header-control-size);
            min-inline-size: var(--header-control-size);
            max-inline-size: var(--header-control-size);
            block-size: var(--header-control-size);
            min-block-size: var(--header-control-size);
            max-block-size: var(--header-control-size);
            flex: 0 0 var(--header-control-size);
          }

          :root .header-controls :is(
            .settings-toggle,
            .round-control,
            .pin-toggle:where(:not(.quiet-control)),
            .share-menu summary:where(:not(.quiet-control)),
            .toolbar-view .view-switch > button
          ) {
            padding: var(--header-control-padding);
          }

          :root .header-controls .toolbar-view,
          :root .header-controls .toolbar-view > .view-switch {
            height: var(--header-control-size);
            min-height: var(--header-control-size);
            max-height: var(--header-control-size);
          }

          :root .header-controls :is(.search-toggle, .search-clear) {
            box-sizing: border-box;
            flex: 0 0 var(--header-control-inner-size);
            width: var(--header-control-inner-size);
            min-width: var(--header-control-inner-size);
            max-width: var(--header-control-inner-size);
            height: var(--header-control-inner-size);
            min-height: var(--header-control-inner-size);
            max-height: var(--header-control-inner-size);
            inline-size: var(--header-control-inner-size);
            block-size: var(--header-control-inner-size);
          }
          '''
          if marker not in css:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'
              path.write_text(css)

          digest = hashlib.sha256(path.read_bytes()).hexdigest()[:12]
          pattern = re.compile(r'(/ssm/assets/control-sizing\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = pattern.sub(rf'\1?v={digest}', text)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          sample = Path('en/index.html').read_text()
          if f'/ssm/assets/control-sizing.css?v={digest}' not in sample:
              raise SystemExit('Homepage did not receive the refreshed control-sizing hash')
          final = path.read_text()
          for required in (marker, '--compact-control-size: var(--tag-capsule-size)', '--header-control-size: var(--compact-control-size)'):
              if required not in final:
                  raise SystemExit(f'Missing compact toolbar rule: {required}')
          print(f'Updated {changed} HTML files; control-sizing={digest}')
          PY
            git add assets/control-sizing.css '*.html' 'en/**/*.html' 'he/**/*.html'
            if git diff --cached --quiet; then
              echo "Live site already current."
              exit 0
            fi
            git commit -m "Publish shared compact toolbar sizing"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent Pages update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
