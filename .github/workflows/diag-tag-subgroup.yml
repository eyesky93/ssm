name: Diagnose subtag cascade

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diag-tag-subgroup.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace tag capsule cascade
        run: |
          set -euo pipefail
          rm -rf /tmp/ssm-tag-cascade
          mkdir -p /tmp/ssm-tag-cascade/ssm
          cp -a . /tmp/ssm-tag-cascade/ssm/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/ssm-tag-cascade/ssm/en/index.html')
          text=p.read_text(encoding='utf-8')
          probe=r'''
          <pre id="cascade-metrics"></pre>
          <script>
          setTimeout(() => {
            const root=document.documentElement;
            const main=document.querySelector('[data-tag-option="physics"]');
            const findings=[];
            function scanRules(rules, href, depth=0) {
              for (const rule of rules || []) {
                if (rule.cssRules) { try { scanRules(rule.cssRules, href, depth+1); } catch {} }
                if (!rule.style) continue;
                const val=rule.style.getPropertyValue('--tag-capsule-size');
                if (!val) continue;
                let rootMatch=false, mainMatch=false;
                try { rootMatch=!!rule.selectorText && root.matches(rule.selectorText); } catch {}
                try { mainMatch=!!rule.selectorText && main.matches(rule.selectorText); } catch {}
                findings.push({href, selector:rule.selectorText||rule.cssText.slice(0,80), value:val.trim(), priority:rule.style.getPropertyPriority('--tag-capsule-size'), rootMatch, mainMatch});
              }
            }
            for (const sheet of document.styleSheets) {
              try { scanRules(sheet.cssRules, sheet.href||'inline'); } catch (e) { findings.push({href:sheet.href||'inline',error:String(e)}); }
            }
            const result={
              rootInline:root.style.getPropertyValue('--tag-capsule-size'),
              rootInlinePriority:root.style.getPropertyPriority('--tag-capsule-size'),
              rootComputed:getComputedStyle(root).getPropertyValue('--tag-capsule-size').trim(),
              mainInline:main?.style.getPropertyValue('--tag-capsule-size')||'',
              mainInlinePriority:main?.style.getPropertyPriority('--tag-capsule-size')||'',
              mainComputed:main?getComputedStyle(main).getPropertyValue('--tag-capsule-size').trim():'',
              sheets:[...document.styleSheets].map((s,i)=>({i,href:s.href||'inline'})),
              findings
            };
            document.querySelector('#cascade-metrics').textContent=JSON.stringify(result);
          },1800);
          </script>
          '''
          p.write_text(text.replace('</body>',probe+'</body>'),encoding='utf-8')
          PY
          cd /tmp/ssm-tag-cascade
          python3 -m http.server 8765 >/tmp/ssm-tag-cascade-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:8765/ssm/en/?tag=physics&filters=temporary' > /tmp/ssm-tag-cascade-dom.html
          python3 - <<'PY'
          import html,re,json
          from pathlib import Path
          dom=Path('/tmp/ssm-tag-cascade-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<pre id="cascade-metrics">(.*?)</pre>',dom,re.S)
          if not m: raise SystemExit('missing cascade metrics')
          r=json.loads(html.unescape(m.group(1)))
          print(json.dumps(r,indent=2))
          PY
