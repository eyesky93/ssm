name: Diagnose subtag styling

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diag-tag-subgroup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace expanded tag sizing tokens
        run: |
          set -euo pipefail
          rm -rf /tmp/ssm-tag-context
          mkdir -p /tmp/ssm-tag-context/ssm
          cp -a . /tmp/ssm-tag-context/ssm/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/ssm-tag-context/ssm/en/index.html')
          text=p.read_text(encoding='utf-8')
          probe=r'''
          <pre id="tag-style-metrics"></pre>
          <script>
          setTimeout(() => {
            const main = document.querySelector('[data-tag-option="physics"]');
            const subgroup = document.querySelector('[data-tag-parent="physics"]');
            const sub = subgroup?.querySelector('.tag-option');
            const entries = {
              main,
              mainChip: main?.querySelector(':scope > .tag-chip'),
              mainCount: main?.querySelector('.tag-count'),
              subgroup,
              sub,
              subChip: sub?.querySelector(':scope > .tag-chip'),
              subCount: sub?.querySelector('.tag-count')
            };
            const props=['display','height','minHeight','paddingInlineStart','paddingInlineEnd','paddingBlockStart','paddingBlockEnd','fontSize','fontWeight','lineHeight','borderRadius','backgroundColor','borderTopWidth','borderTopColor','color','gap','transform'];
            const vars=['--control-size','--tag-capsule-size','--tag-capsule-inner-size','--tag-capsule-padding-inline','--tag-capsule-count-inset','--tag-capsule-content-gap','--tag-count-size','--tag-count-font-size'];
            const result={};
            for (const [name,el] of Object.entries(entries)) {
              if (!el) { result[name]={missing:true}; continue; }
              const cs=getComputedStyle(el); const item={};
              for (const prop of props) item[prop]=cs[prop];
              for (const v of vars) item[v]=cs.getPropertyValue(v).trim();
              item.rectHeight=el.getBoundingClientRect().height.toFixed(3);
              item.class=el.className; item.style=el.getAttribute('style')||''; item.hidden=el.hidden; item.pressed=el.getAttribute('aria-pressed')||'';
              result[name]=item;
            }
            document.querySelector('#tag-style-metrics').textContent=JSON.stringify(result);
          }, 1800);
          </script>
          '''
          p.write_text(text.replace('</body>',probe+'</body>'),encoding='utf-8')
          PY
          cd /tmp/ssm-tag-context
          python3 -m http.server 8765 >/tmp/ssm-tag-context-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:8765/ssm/en/?tag=physics&filters=temporary' > /tmp/ssm-tag-context-dom.html
          python3 - <<'PY'
          import html,re,json
          from pathlib import Path
          dom=Path('/tmp/ssm-tag-context-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<pre id="tag-style-metrics">(.*?)</pre>',dom,re.S)
          if not m: raise SystemExit('missing metrics')
          result=json.loads(html.unescape(m.group(1)))
          for k,v in result.items(): print(k, v)
          PY
