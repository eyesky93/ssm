name: Verify subtag styling

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diag-tag-subgroup.yml'

permissions:
  contents: write

jobs:
  verify-and-cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust generated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'control-sizing.css?v=5568de927a29'
          new = 'control-sizing.css?v=cd8e0afad736'
          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed += 1
          print(f'updated {changed} html files')
          if changed == 0:
              raise SystemExit('expected generated HTML fingerprint updates')
          PY

      - name: Verify real expanded menu geometry
        run: |
          set -euo pipefail
          grep -F ':root body .home-main .browser-toolbar .subject-nav {' assets/control-sizing.css
          grep -F -- '--tag-capsule-size: var(--control-size) !important;' assets/control-sizing.css

          rm -rf /tmp/ssm-subtag-check
          mkdir -p /tmp/ssm-subtag-check/ssm
          cp -a . /tmp/ssm-subtag-check/ssm/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/ssm-subtag-check/ssm/en/index.html')
          text=p.read_text(encoding='utf-8')
          probe=r'''
          <pre id="tag-style-metrics"></pre>
          <script>
          setTimeout(() => {
            const main = document.querySelector('[data-tag-option="physics"]');
            const subgroup = document.querySelector('[data-tag-parent="physics"]');
            const sub = subgroup?.querySelector('.tag-option');
            const entries = {
              main,
              mainChip: main?.querySelector(':scope > .tag-chip'),
              mainCount: main?.querySelector('.tag-count'),
              sub,
              subChip: sub?.querySelector(':scope > .tag-chip'),
              subCount: sub?.querySelector('.tag-count')
            };
            const result={};
            for (const [name,el] of Object.entries(entries)) {
              if (!el) { result[name]={missing:true}; continue; }
              const cs=getComputedStyle(el);
              result[name]={
                height: el.getBoundingClientRect().height,
                minHeight: parseFloat(cs.minHeight) || 0,
                fontSize: parseFloat(cs.fontSize) || 0,
                tagSize: cs.getPropertyValue('--tag-capsule-size').trim(),
                controlSize: cs.getPropertyValue('--control-size').trim()
              };
            }
            document.querySelector('#tag-style-metrics').textContent=JSON.stringify(result);
          },1800);
          </script>
          '''
          p.write_text(text.replace('</body>',probe+'</body>'),encoding='utf-8')
          PY

          cd /tmp/ssm-subtag-check
          python3 -m http.server 8765 >/tmp/ssm-subtag-check-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:8765/ssm/en/?tag=physics&filters=temporary' > /tmp/ssm-subtag-check-dom.html
          python3 - <<'PY'
          import html,re,json
          from pathlib import Path
          dom=Path('/tmp/ssm-subtag-check-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<pre id="tag-style-metrics">(.*?)</pre>',dom,re.S)
          if not m: raise SystemExit('missing metrics')
          r=json.loads(html.unescape(m.group(1)))
          print('subtag consistency metrics:', r)
          for name in ('main','mainChip','mainCount','sub','subChip','subCount'):
              assert not r.get(name,{}).get('missing'), r
          def same(a,b,tol=.15): return abs(a-b) <= tol
          assert same(r['main']['height'], r['sub']['height']), r
          assert same(r['mainChip']['height'], r['subChip']['height']), r
          assert same(r['mainCount']['height'], r['subCount']['height']), r
          assert same(r['mainChip']['fontSize'], r['subChip']['fontSize'], .01), r
          assert r['main']['height'] >= 30, r
          assert r['sub']['height'] >= 30, r
          assert '1.9575rem' in r['main']['tagSize'] or r['main']['tagSize'] == r['main']['controlSize'], r
          assert r['main']['tagSize'] == r['sub']['tagSize'], r
          PY

      - name: Commit cache-bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No fingerprint changes to commit.'
          else
            git commit -m 'Cache-bust consistent subtag styling'
            git push
          fi
