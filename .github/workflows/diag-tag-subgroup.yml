name: Diagnose subtag styling

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diag-tag-subgroup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure real expanded homepage state
        run: |
          set -euo pipefail
          rm -rf /tmp/ssm-tag-context
          mkdir -p /tmp/ssm-tag-context/ssm
          cp -a . /tmp/ssm-tag-context/ssm/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/ssm-tag-context/ssm/en/index.html')
          text=p.read_text(encoding='utf-8')
          probe=r'''
          <output id="tag-style-metrics"></output>
          <script>
          setTimeout(() => {
            const main = document.querySelector('[data-tag-option="physics"]');
            const mainChip = main?.querySelector(':scope > .tag-chip');
            const mainCount = mainChip?.querySelector('.tag-count');
            const subgroup = document.querySelector('[data-tag-parent="physics"]');
            const sub = subgroup?.querySelector('.tag-option');
            const subChip = sub?.querySelector(':scope > .tag-chip');
            const subCount = subChip?.querySelector('.tag-count');
            const out = document.querySelector('#tag-style-metrics');
            const entries = {main,mainChip,mainCount,subgroup,sub,subChip,subCount};
            const props=['display','height','minHeight','paddingInlineStart','paddingInlineEnd','paddingBlockStart','paddingBlockEnd','fontSize','fontWeight','lineHeight','borderRadius','backgroundColor','borderTopWidth','borderTopColor','color','gap','transform'];
            for (const [name,el] of Object.entries(entries)) {
              if (!el) { out.dataset[name+'_missing']='true'; continue; }
              const cs=getComputedStyle(el);
              for (const prop of props) out.dataset[name+'_'+prop]=cs[prop];
              out.dataset[name+'_rectHeight']=el.getBoundingClientRect().height.toFixed(3);
              out.dataset[name+'_class']=el.className;
              out.dataset[name+'_style']=el.getAttribute('style')||'';
              out.dataset[name+'_hidden']=String(el.hidden);
              out.dataset[name+'_pressed']=el.getAttribute('aria-pressed')||'';
            }
          }, 1800);
          </script>
          '''
          text=text.replace('</body>',probe+'</body>')
          p.write_text(text,encoding='utf-8')
          PY
          cd /tmp/ssm-tag-context
          python3 -m http.server 8765 >/tmp/ssm-tag-context-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:8765/ssm/en/?tag=physics&filters=temporary' > /tmp/ssm-tag-context-dom.html
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          dom=Path('/tmp/ssm-tag-context-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<output id="tag-style-metrics"([^>]*)>',dom)
          if not m: raise SystemExit('missing metrics')
          attrs={k:html.unescape(v) for k,v in re.findall(r'data-([^=]+)="([^"]*)"',m.group(1))}
          for prefix in ('main','mainchip','maincount','subgroup','sub','subchip','subcount'):
              print(prefix, {k[len(prefix)+1:]:v for k,v in attrs.items() if k.startswith(prefix+'_')})
          PY
