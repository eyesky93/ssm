name: Fix share neutral global

on:
  push:
    paths:
      - '.github/workflows/fix-share-neutral-global.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply last-loaded global share styling
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/fix_share.py
          python3 /tmp/fix_share.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use global neutral grey share surface'
          git push
