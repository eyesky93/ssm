name: Deploy reader share above header controls

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-reader-share-v6.yml"

permissions:
  contents: write

concurrency:
  group: ssm-reader-share-v6
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish fixed reader share layering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          post_path = Path('assets/post-layout.css')
          post_css = post_path.read_text()
          marker = '/* reader-share-header-layer-v6:start */'
          block = r'''
          /* reader-share-header-layer-v6:start */
          :root {
            --reader-share-option-size: var(--control-size);
            --reader-share-icon-size: var(--control-icon-size);
            --reader-share-gap: var(--header-control-gap);
            --reader-share-layer: 1000;
          }
          :root body .header-controls .article-actions:has(.share-menu[open]) {
            position: relative !important;
            z-index: var(--reader-share-layer) !important;
            overflow: visible !important;
          }
          :root body .header-controls .share-menu {
            position: relative !important;
            box-sizing: border-box !important;
            flex: 0 0 var(--reader-share-option-size) !important;
            width: var(--reader-share-option-size) !important;
            min-width: var(--reader-share-option-size) !important;
            max-width: var(--reader-share-option-size) !important;
            height: var(--reader-share-option-size) !important;
            min-height: var(--reader-share-option-size) !important;
            max-height: var(--reader-share-option-size) !important;
            overflow: visible !important;
          }
          :root body .header-controls .share-menu > summary {
            position: relative !important;
            z-index: calc(var(--reader-share-layer) + 2) !important;
          }
          :root body .header-controls .share-menu[open] {
            z-index: calc(var(--reader-share-layer) + 1) !important;
          }
          :root[dir="ltr"] body .header-controls .share-menu > .share-options,
          :root[dir="ltr"] body .header-controls .share-menu[data-share-side="above"] > .share-options {
            position: absolute !important;
            left: auto !important;
            right: calc(100% + var(--reader-share-gap)) !important;
            top: 50% !important;
            bottom: auto !important;
          }
          :root[dir="rtl"] body .header-controls .share-menu > .share-options,
          :root[dir="rtl"] body .header-controls .share-menu[data-share-side="above"] > .share-options {
            position: absolute !important;
            right: auto !important;
            left: calc(100% + var(--reader-share-gap)) !important;
            top: 50% !important;
            bottom: auto !important;
          }
          :root body .header-controls .share-menu > .share-options,
          :root body .header-controls .share-menu[data-share-side="above"] > .share-options {
            z-index: var(--reader-share-layer) !important;
            display: flex !important;
            flex-flow: row nowrap !important;
            align-items: center !important;
            width: max-content !important;
            max-width: none !important;
            gap: var(--reader-share-gap) !important;
            padding: 0 !important;
            margin: 0 !important;
            transform: translateY(-50%) !important;
            translate: none !important;
            overflow: visible !important;
          }
          :root body .header-controls .share-menu > .share-options > :is(a, button) {
            box-sizing: border-box !important;
            flex: 0 0 var(--reader-share-option-size) !important;
            width: var(--reader-share-option-size) !important;
            min-width: var(--reader-share-option-size) !important;
            max-width: var(--reader-share-option-size) !important;
            height: var(--reader-share-option-size) !important;
            min-height: var(--reader-share-option-size) !important;
            max-height: var(--reader-share-option-size) !important;
            padding: var(--control-padding) !important;
          }
          :root body .header-controls .share-menu > .share-options > :is(a, button) > svg {
            width: var(--reader-share-icon-size) !important;
            height: var(--reader-share-icon-size) !important;
          }
          /* reader-share-header-layer-v6:end */
          '''
          if marker not in post_css:
              post_css = post_css.rstrip() + '\n\n' + block.strip() + '\n'
          post_path.write_text(post_css)

          site_path = Path('assets/site.js')
          site_js = site_path.read_text()
          js_marker = '// reader-header-horizontal-share-v6'
          if js_marker not in site_js:
              needle = '''  const options = menu.querySelector(".share-options");\n  options.style.maxBlockSize = "";\n  options.style.translate = "";\n'''
              replacement = needle + '''\n  // reader-header-horizontal-share-v6\n  // Reader-header sharing is a horizontal strip with CSS-owned geometry.\n  // Do not run the legacy vertical-menu side selection or viewport translation.\n  if (menu.closest(".header-controls") && !menu.classList.contains("card-share-menu")) {\n    menu.removeAttribute("data-share-side");\n    options.style.removeProperty("translate");\n    menu.dataset.shareReady = "true";\n    return;\n  }\n'''
              if needle not in site_js:
                  raise SystemExit('Could not find share-menu positioning hook in site.js')
              site_js = site_js.replace(needle, replacement, 1)
          site_path.write_text(site_js)

          post_digest = hashlib.sha256(post_path.read_bytes()).hexdigest()[:12]
          site_digest = hashlib.sha256(site_path.read_bytes()).hexdigest()[:12]
          post_pattern = re.compile(r'((?:/ssm)?/assets/post-layout\.css)\?v=[0-9a-f]+')
          site_pattern = re.compile(r'((?:/ssm)?/assets/site\.js)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = post_pattern.sub(rf'\1?v={post_digest}', text)
              updated = site_pattern.sub(rf'\1?v={site_digest}', updated)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          final_post = post_path.read_text()
          for required in (
              marker,
              '.article-actions:has(.share-menu[open])',
              'right: calc(100% + var(--reader-share-gap)) !important;',
              'z-index: var(--reader-share-layer) !important;',
              'transform: translateY(-50%) !important;',
          ):
              if required not in final_post:
                  raise SystemExit(f'Missing reader share CSS invariant: {required}')
          if js_marker not in site_path.read_text():
              raise SystemExit('Missing reader share JS invariant')

          sample = Path('en/posts/mathematical-background-1/index.html').read_text()
          if not re.search(rf'(?:/ssm)?/assets/post-layout\.css\?v={post_digest}', sample):
              raise SystemExit('Reader page did not receive refreshed post-layout hash')
          if not re.search(rf'(?:/ssm)?/assets/site\.js\?v={site_digest}', sample):
              raise SystemExit('Reader page did not receive refreshed site.js hash')
          print(f'Updated {changed} HTML files; post-layout={post_digest}; site={site_digest}')
          PY
            git add assets/post-layout.css assets/site.js '*.html' 'en/**/*.html' 'he/**/*.html'
            if git diff --cached --quiet; then
              echo "Reader share v6 is already current."
              exit 0
            fi
            git commit -m "Keep reader share destinations above header controls"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/4)."
            sleep 2
          done
          exit 1
