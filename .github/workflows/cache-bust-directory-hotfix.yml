name: Cache-bust Directory layout hotfix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update-home-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update home stylesheet fingerprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'control-sizing.css?v=21cc6717d181'
          new = 'control-sizing.css?v=cf40097964fd'
          for name in ('en/index.html', 'he/index.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit(f'Missing control-sizing fingerprint in {name}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          if git diff --quiet -- en/index.html he/index.html; then
            echo 'Fingerprint already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/index.html he/index.html
          git commit -m 'Cache-bust Directory layout hotfix'
          git push
