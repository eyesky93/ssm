name: Restore vertical card actions

on:
  push:
    paths:
      - '.github/workflows/restore-vertical-card-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore vertical action stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          css_path = Path('assets/control-sizing.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* restore-vertical-card-actions-v1 */'
          rules = base64.b64decode('').decode('utf-8')
          # Decode the complete rule set from a second payload to keep YAML simple.
          rules = base64.b64decode('').decode('utf-8', errors='ignore')
