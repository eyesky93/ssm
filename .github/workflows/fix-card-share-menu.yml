name: Fix card share menu

on:
  push:
    paths:
      - '.github/workflows/fix-card-share-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact horizontal card share menu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          css_path = Path('assets/post-layout.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* card-share-horizontal-quiet-v1 */'
          rule = "\n\n/* card-share-horizontal-quiet-v1 */\n:root .post-stream[data-layout] [data-card-actions] .card-share-menu > .share-options { inset-inline-end: 0; inset-block-start: calc(100% + var(--quiet-control-gap)); display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; width: max-content; max-width: none; gap: var(--quiet-control-gap); padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; overflow: visible; }\n:root .post-stream[data-layout] [data-card-actions] .card-share-menu > .share-options > :is(a, button) { box-sizing: border-box; display: inline-grid; place-items: center; flex: 0 0 var(--quiet-control-target-size); width: var(--quiet-control-target-size); min-width: var(--quiet-control-target-size); max-width: var(--quiet-control-target-size); height: var(--quiet-control-target-size); min-height: var(--quiet-control-target-size); max-height: var(--quiet-control-target-size); inline-size: var(--quiet-control-target-size); min-inline-size: var(--quiet-control-target-size); max-inline-size: var(--quiet-control-target-size); block-size: var(--quiet-control-target-size); min-block-size: var(--quiet-control-target-size); max-block-size: var(--quiet-control-target-size); margin: 0; padding: 0; border: 0; border-radius: var(--quiet-control-radius); background: transparent; color: var(--quiet-control-color); box-shadow: none; transform: none; }\n:root .post-stream[data-layout] [data-card-actions] .card-share-menu > .share-options > :is(a, button) > svg { width: var(--quiet-control-icon-size); height: var(--quiet-control-icon-size); }\n:root .post-stream[data-layout] [data-card-actions] .card-share-menu > .share-options > :is(a, button):is(:hover, :focus-visible, :active) { border: 0; background: transparent; color: var(--quiet-control-active-color); box-shadow: none; }\n:root .post-stream[data-layout] [data-card-actions] .card-share-menu > .share-options > :is(a, button):focus-visible { outline: 1px solid var(--quiet-control-color); outline-offset: 0; }\n:root .post-stream[data-layout] [data-card-actions] .card-share-menu[data-share-side=\"above\"] > .share-options { inset-block-start: auto; inset-block-end: calc(100% + var(--quiet-control-gap)); }\n"
          if marker not in css:
              css += rule
              css_path.write_text(css, encoding='utf-8')

          version = hashlib.sha256(css.encode()).hexdigest()[:12]
          pattern = re.compile(r'(assets/post-layout\.css)\?v=[0-9a-f]+')
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = pattern.sub(rf'\1?v={version}', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/fix-card-share-menu.yml').unlink()
          print(version)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make card share menu horizontal and frameless'
          git push
