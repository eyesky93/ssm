name: Validate generated homepage controls
on:
  push:
    branches: [codex/pages-ui-validation-20260916]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Apply the locally generated and fingerprinted public delta
        shell: bash
        run: |
          set -euo pipefail
          cp -R .ssm-validation "$RUNNER_TEMP/ssm-validation"
          git fetch --depth=1 origin b776f12a1acdbd4c129869a5732ca6bd6861cfda
          git checkout --detach b776f12a1acdbd4c129869a5732ca6bd6861cfda
          python3 - <<'PY'
          import base64, json, lzma, os, subprocess
          from pathlib import Path
          root = Path.cwd().resolve()
          payload = Path(os.environ['RUNNER_TEMP']) / 'ssm-validation/generated.delta.xz.b64'
          data = json.loads(lzma.decompress(base64.b64decode(payload.read_text())))
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == data['base']
          assert len(data['files']) == 49
          assert len({item['path'] for item in data['files']}) == 49
          for item in data['files']:
              path = (root / item['path']).resolve()
              assert root in path.parents and path.is_file() and not path.is_symlink()
              assert item['path'] == 'assets/post-layout.css' or (item['path'].startswith(('en/', 'he/')) and item['path'].endswith('/index.html'))
              original = path.read_bytes()
              previous_end = 0
              for start, end, fragment in item['edits']:
                  assert 0 <= previous_end <= start <= end <= len(original)
                  assert 0 <= fragment < len(data['fragments'])
                  previous_end = end
              result = original
              for start, end, fragment in reversed(item['edits']):
                  result = result[:start] + data['fragments'][fragment].encode() + result[end:]
              path.write_bytes(result)
          subprocess.run(['git', 'add', '--all'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == data['tree'] == '38c2228e19d895669c323ee5833046967440a074', tree
          print('Verified all generated bytes; approved tree:', tree)
          PY
      - name: Install isolated browser validation
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ssm-venv"
          "$RUNNER_TEMP/ssm-venv/bin/pip" install playwright
          "$RUNNER_TEMP/ssm-venv/bin/python" -m playwright install --with-deps chromium
      - name: Check both languages, themes and all layouts without production requests
        run: '"$RUNNER_TEMP/ssm-venv/bin/python" "$RUNNER_TEMP/ssm-validation/validate.py"'
      - name: Save the verified generated commit on an isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = b776f12a1acdbd4c129869a5732ca6bd6861cfda
          test "$(git write-tree)" = 38c2228e19d895669c323ee5833046967440a074
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish generated homepage Read Share Pin controls (source 50015c2)'
          git push origin HEAD:refs/heads/codex/home-card-actions-generated-20260916
          echo "Generated commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Only generated public files were committed. No private sources, validation payloads, workflows, data changes or credentials enter the publishing tree.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homepage-controls-validation
          path: ${{ runner.temp }}/ssm-ui-results/
          if-no-files-found: ignore
          retention-days: 1
