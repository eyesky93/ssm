name: Deploy accent revert hover

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-accent-revert.yml"

permissions:
  contents: write

concurrency:
  group: ssm-accent-revert-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch accent revert and refresh every page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('assets/control-sizing.css')
          css = path.read_text()
          start = '/* accent-revert-hover-v2:start */'
          end = '/* accent-revert-hover-v2:end */'
          block = r'''
          /* accent-revert-hover-v2:start */
          /* Revert is one transparent cell inside the vertical color capsule.
             Hover/focus accents only the arrow glyph; the cell never paints an
             independent frame, fill or shadow over the capsule. */
          :root body .header-actions .accent-reset {
            position: relative !important;
            z-index: 1 !important;
            display: grid !important;
            place-items: center !important;
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            outline: none !important;
            color: var(--ink) !important;
          }
          :root body .header-actions .accent-reset:is(:hover, :focus-visible) {
            position: relative !important;
            z-index: 1 !important;
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            outline: none !important;
            color: var(--accent-strong) !important;
          }
          :root body .header-actions .accent-reset > svg {
            display: block !important;
            margin: 0 !important;
            flex: none !important;
            color: inherit !important;
            stroke: currentColor !important;
          }
          :root body .header-actions .accent-panel::after {
            z-index: 4 !important;
          }
          /* accent-revert-hover-v2:end */
          '''.strip()

          css = re.sub(
              re.escape(start) + r'.*?' + re.escape(end),
              '',
              css,
              flags=re.S,
          ).rstrip()
          css += '\n\n' + block + '\n'
          path.write_text(css)

          digest = hashlib.sha256(path.read_bytes()).hexdigest()[:12]
          pattern = re.compile(r'((?:/ssm)?/assets/control-sizing\.css)\?v=[^"\']+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = pattern.sub(rf'\1?v={digest}', text)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          final = path.read_text()
          for required in (
              start,
              'color: var(--accent-strong) !important',
              'box-shadow: none !important',
              'outline: none !important',
              'background: transparent !important',
              'z-index: 4 !important',
          ):
              if required not in final:
                  raise SystemExit(f'Missing accent revert rule: {required}')
          if 'box-shadow: inset 0 0 0 1px var(--accent-strong)' in final:
              raise SystemExit('Accent revert still paints a frame')

          sample = Path('en/index.html').read_text()
          if not re.search(rf'(?:/ssm)?/assets/control-sizing\.css\?v={digest}', sample):
              raise SystemExit('Homepage did not receive refreshed control-sizing stylesheet hash')
          print(f'Updated {changed} HTML files; control-sizing={digest}')
          PY
            git add assets/control-sizing.css
            find . -name '*.html' -print0 | xargs -0 git add --
            if git diff --cached --quiet; then
              echo "Accent revert is already current."
              exit 0
            fi
            git commit -m "Publish icon-only accent revert hover"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent Pages update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
