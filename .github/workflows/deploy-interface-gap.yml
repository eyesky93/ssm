name: Deploy unified interface spacing

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-interface-gap.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current Pages tree and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('assets/styles.css')
          css = path.read_text()
          marker = '/* shared-interface-gap-v1 */'
          block = r'''
          /* shared-interface-gap-v1 */
          /* One global spacing token owns the visible chrome gaps: header-to-rule,
             rule-to-tags, inter-control/inter-tag spacing, tags-to-rule, rule-to-posts,
             and the spacing between adjacent post cards. It intentionally matches the
             smallest existing tag gap; internal component padding remains independent. */
          :root {
            --interface-gap: var(--tag-capsule-gap, .25rem);
          }
          :root .site-header {
            min-height: 0;
            padding-block: var(--interface-gap);
            gap: var(--interface-gap);
          }
          :root .header-controls {
            --header-control-gap: var(--interface-gap) !important;
            --header-control-half-gap: calc(var(--interface-gap) / 2) !important;
            gap: var(--interface-gap);
          }
          :root .toolbar-view > .view-switch {
            gap: var(--interface-gap) !important;
          }
          :root :is(.subject-nav, .tag-list) {
            gap: var(--interface-gap) !important;
          }
          :root .browser-toolbar {
            padding-block: var(--interface-gap);
            margin-block-end: var(--interface-gap);
          }
          :root .post-stream {
            gap: var(--interface-gap) !important;
          }
          :root .wordmark {
            min-height: var(--compact-control-size) !important;
            height: var(--compact-control-size) !important;
            padding-block: 0 !important;
            padding-inline: calc(3 * var(--interface-gap)) !important;
            border-radius: var(--control-radius) !important;
          }
          '''
          if marker not in css:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'
              path.write_text(css)

          digest = hashlib.sha256(path.read_bytes()).hexdigest()[:12]
          pattern = re.compile(r'(/ssm/assets/styles\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = pattern.sub(rf'\1?v={digest}', text)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          sample = Path('en/index.html').read_text()
          if f'/ssm/assets/styles.css?v={digest}' not in sample:
              raise SystemExit('Homepage did not receive refreshed styles hash')
          final = path.read_text()
          for required in (marker, '--interface-gap:', '.browser-toolbar', '.wordmark'):
              if required not in final:
                  raise SystemExit(f'Missing interface-gap rule: {required}')
          print(f'Updated {changed} HTML files; styles={digest}')
          PY
            git add assets/styles.css '*.html' 'en/**/*.html' 'he/**/*.html'
            if git diff --cached --quiet; then
              echo "Live site already current."
              exit 0
            fi
            git commit -m "Publish compact wordmark and unified interface spacing"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent Pages update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
