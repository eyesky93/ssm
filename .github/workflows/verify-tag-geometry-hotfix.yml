name: Verify tag geometry hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-tag-geometry-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust generated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'control-sizing.css?v=dce72275122e'
          new = 'control-sizing.css?v=847f683003d1'
          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed += 1
          print(f'updated {changed} html files')
          if changed == 0:
              raise SystemExit('expected at least one generated HTML fingerprint update')
          PY

      - name: Render shared tag geometry offline
        run: |
          set -euo pipefail
          test -x "$(command -v google-chrome)"
          rm -rf /tmp/ssm-tag-check
          mkdir -p /tmp/ssm-tag-check/ssm
          cp -a . /tmp/ssm-tag-check/ssm/
          cat > /tmp/ssm-tag-check/ssm/tag-check.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <link rel="stylesheet" href="/ssm/assets/styles.css">
            <link rel="stylesheet" href="/ssm/assets/post-layout.css">
            <link rel="stylesheet" href="/ssm/assets/control-sizing.css">
          </head>
          <body>
            <nav class="subject-nav"><div class="tag-list"><span class="tag-option"><a class="tag-chip"><span>Physics</span><span class="tag-count">5</span></a><button class="tag-exclude"></button></span></div></nav>
            <div class="post-stream" data-layout="list"><article class="post-card"><div class="card-tags"><a class="tag-chip card-tag"><span>Physics</span></a></div></article></div>
            <output id="metrics"></output>
            <script>
              addEventListener('load', () => {
                const menu = document.querySelector('.subject-nav .tag-option');
                const menuChip = document.querySelector('.subject-nav .tag-chip');
                const count = document.querySelector('.subject-nav .tag-count');
                const card = document.querySelector('.card-tags .tag-chip');
                const out = document.querySelector('#metrics');
                out.dataset.menuHeight = menu.getBoundingClientRect().height.toFixed(3);
                out.dataset.menuChipHeight = menuChip.getBoundingClientRect().height.toFixed(3);
                out.dataset.cardHeight = card.getBoundingClientRect().height.toFixed(3);
                out.dataset.countSize = count.getBoundingClientRect().height.toFixed(3);
                out.dataset.countFont = parseFloat(getComputedStyle(count).fontSize).toFixed(3);
                out.dataset.labelFont = parseFloat(getComputedStyle(menuChip).fontSize).toFixed(3);
              });
            </script>
          </body>
          </html>
          HTML
          cd /tmp/ssm-tag-check
          python3 -m http.server 8765 >/tmp/ssm-tag-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-networking --dump-dom http://127.0.0.1:8765/ssm/tag-check.html > /tmp/ssm-tag-dom.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          dom = Path('/tmp/ssm-tag-dom.html').read_text(encoding='utf-8')
          attrs = dict(re.findall(r'data-([a-z-]+)="([0-9.]+)"', dom))
          required = ['menu-height','menu-chip-height','card-height','count-size','count-font','label-font']
          missing = [k for k in required if k not in attrs]
          if missing:
              raise SystemExit(f'missing rendered metrics: {missing}')
          m = {k: float(attrs[k]) for k in required}
          print('rendered tag metrics:', m)
          assert abs(m['menu-height'] - m['card-height']) <= 0.6, m
          assert abs(m['menu-chip-height'] - m['card-height']) <= 0.6, m
          assert m['count-size'] < m['menu-height'], m
          assert m['count-size'] >= m['menu-height'] * 0.78, m
          assert m['count-font'] >= m['label-font'] * 0.90, m
          PY

      - name: Commit cache-bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No fingerprint changes to commit.'
          else
            git commit -m 'Cache-bust verified tag geometry hotfix'
            git push
          fi
