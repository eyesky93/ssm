name: Deploy fixed reader share anchor

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-reader-share-fixed-anchor.yml"

permissions:
  contents: write

concurrency:
  group: ssm-header-hover-cache-fix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish shared Settings-style header hover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('assets/control-sizing.css')
          css = path.read_text()
          start = '/* framed-control-settings-hover-v2:start */'
          end = '/* framed-control-settings-hover-v2:end */'
          block = r'''
          /* framed-control-settings-hover-v2:start */
          /* All independent header controls use the Settings interaction model:
             the neutral frame stays in place while both frame and glyph/text use
             the accent on hover/focus/press/open. This final shared rule also
             overrides older reader-specific temporary rules. */
          :root body .header-controls .framed-control:not(:disabled):not([aria-disabled="true"]):is(:hover, :focus-visible, :active),
          :root body .header-controls .framed-control[aria-expanded="true"] {
            border-color: var(--accent-strong) !important;
            background: var(--surface) !important;
            color: var(--accent-strong) !important;
            box-shadow: none !important;
            transform: none !important;
          }
          /* framed-control-settings-hover-v2:end */
          '''
          if start in css and end in css:
              css = re.sub(re.escape(start) + r'.*?' + re.escape(end), block.strip(), css, flags=re.S)
          else:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'
          path.write_text(css)

          digest = hashlib.sha256(path.read_bytes()).hexdigest()[:12]
          pattern = re.compile(r'((?:/ssm)?/assets/control-sizing\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = pattern.sub(rf'\1?v={digest}', text)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          final = path.read_text()
          for required in (
              start,
              'border-color: var(--accent-strong) !important;',
              'color: var(--accent-strong) !important;',
              end,
          ):
              if required not in final:
                  raise SystemExit(f'Missing header-hover invariant: {required}')

          sample = Path('en/posts/welcome/index.html').read_text()
          if not re.search(rf'(?:/ssm)?/assets/control-sizing\.css\?v={digest}', sample):
              raise SystemExit('Reader did not receive refreshed control-sizing hash')

          failed = Path('.github/workflows/one-shot-fix-header-hover.yml')
          if failed.exists():
              failed.unlink()
          Path('.github/workflows/deploy-reader-share-fixed-anchor.yml').unlink()
          print(f'Updated {changed} HTML files; control-sizing={digest}')
          PY
            git add -A
            if git diff --cached --quiet; then
              echo "Header hover behavior is already current."
              exit 0
            fi
            git commit -m "Make header control glyphs blue on hover with cache bust"
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 2
          done
          exit 1
