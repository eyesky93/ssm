name: Verify tag layout split

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-tag-layout-split.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust generated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'control-sizing.css?v=847f683003d1'
          new = 'control-sizing.css?v=c4567cf8c3d7'
          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed += 1
          print(f'updated {changed} html files')
          if changed == 0:
              raise SystemExit('expected at least one generated HTML fingerprint update')
          PY

      - name: Render layout-specific tag geometry offline
        run: |
          set -euo pipefail
          test -x "$(command -v google-chrome)"
          rm -rf /tmp/ssm-tag-split
          mkdir -p /tmp/ssm-tag-split/ssm
          cp -a . /tmp/ssm-tag-split/ssm/
          cat > /tmp/ssm-tag-split/ssm/tag-split.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <link rel="stylesheet" href="/ssm/assets/styles.css">
            <link rel="stylesheet" href="/ssm/assets/post-layout.css">
            <link rel="stylesheet" href="/ssm/assets/control-sizing.css">
          </head>
          <body>
            <nav class="subject-nav"><div class="tag-list"><span class="tag-option"><a class="tag-chip"><span>Physics</span><span class="tag-count">5</span></a><button class="tag-exclude"></button></span></div></nav>
            <div class="post-stream" data-layout="list"><article class="post-card"><div class="card-tags"><a class="tag-chip card-tag"><span>Physics</span></a></div></article></div>
            <div class="post-stream" data-layout="grid"><article class="post-card"><div class="card-tags"><a class="tag-chip card-tag"><span>Physics</span></a></div></article></div>
            <div class="post-stream" data-layout="compact"><article class="post-card"><div class="card-tags"><a class="tag-chip card-tag"><span>Physics</span></a></div></article></div>
            <output id="metrics"></output>
            <script>
              addEventListener('load', () => {
                const pick = (selector) => document.querySelector(selector);
                const metric = (el) => ({
                  height: el.getBoundingClientRect().height,
                  font: parseFloat(getComputedStyle(el).fontSize)
                });
                const values = {
                  menu: metric(pick('.subject-nav .tag-chip')),
                  menuOuter: metric(pick('.subject-nav .tag-option')),
                  list: metric(pick('.post-stream[data-layout="list"] .tag-chip')),
                  grid: metric(pick('.post-stream[data-layout="grid"] .tag-chip')),
                  compact: metric(pick('.post-stream[data-layout="compact"] .tag-chip'))
                };
                const out = pick('#metrics');
                for (const [key, value] of Object.entries(values)) {
                  out.dataset[`${key}Height`] = value.height.toFixed(3);
                  out.dataset[`${key}Font`] = value.font.toFixed(3);
                }
              });
            </script>
          </body>
          </html>
          HTML
          cd /tmp/ssm-tag-split
          python3 -m http.server 8765 >/tmp/ssm-tag-split-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-networking --dump-dom http://127.0.0.1:8765/ssm/tag-split.html > /tmp/ssm-tag-split-dom.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          dom = Path('/tmp/ssm-tag-split-dom.html').read_text(encoding='utf-8')
          attrs = dict(re.findall(r'data-([a-z-]+)="([0-9.]+)"', dom))
          required = [
              'menu-height','menu-font','menu-outer-height','menu-outer-font',
              'list-height','list-font','grid-height','grid-font','compact-height','compact-font'
          ]
          missing = [key for key in required if key not in attrs]
          if missing:
              raise SystemExit(f'missing rendered metrics: {missing}')
          m = {key: float(attrs[key]) for key in required}
          print('rendered tag metrics:', m)
          assert m['list-height'] > m['grid-height'] + 1.0, m
          assert m['menu-outer-height'] > m['grid-height'] + 1.0, m
          assert abs(m['grid-height'] - m['compact-height']) <= 0.6, m
          assert m['list-font'] > m['grid-font'] + 0.5, m
          assert m['menu-font'] > m['grid-font'] + 0.5, m
          assert abs(m['grid-font'] - m['compact-font']) <= 0.1, m
          PY

      - name: Commit cache-bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No fingerprint changes to commit.'
          else
            git commit -m 'Cache-bust tag layout split'
            git push
          fi
