name: Deploy list card rail v2

on:
  push:
    paths:
      - '.github/workflows/deploy-list-card-rail-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply list card rail and rotate cache
        shell: bash
        run: |
          set -euo pipefail
          MARKER='/* list-card-separated-rail-v2 */'
          if ! grep -Fq "$MARKER" assets/control-sizing.css; then
            printf '%s' '' | base64 -d >> assets/control-sizing.css
          fi
          HASH=$(sha256sum assets/control-sizing.css | cut -c1-12)
          find . -type f -name '*.html' -print0 | xargs -0 sed -i -E "s#assets/control-sizing\.css\?v=[0-9a-f]+#assets/control-sizing.css?v=${HASH}#g"
          rm .github/workflows/deploy-list-card-rail-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Separate list action rail and match grid typography'
          git push
