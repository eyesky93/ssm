name: Deploy reader share anchor fix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-reader-share-anchor.yml"

permissions:
  contents: write

concurrency:
  group: ssm-reader-share-anchor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anchor share destinations beside Share
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('assets/post-layout.css')
          css = path.read_text()
          marker = '/* reader-share-physical-left-v4 */'
          block = r'''
          /* reader-share-physical-left-v4 */
          /* Force the reader share strip to the physical left of Share in LTR
             and physical right in RTL. This beats logical-side ambiguity and
             viewport clamping while keeping the trigger visible. */
          :root {
            --reader-share-option-size: var(--control-size);
            --reader-share-icon-size: var(--control-icon-size);
            --reader-share-gap: var(--header-control-gap);
            --reader-share-padding: 0;
          }
          :root body .header-controls .share-menu > summary,
          :root body .header-controls .share-menu > .share-options > :is(a, button) {
            box-sizing: border-box;
            flex: 0 0 var(--reader-share-option-size);
            width: var(--reader-share-option-size);
            min-width: var(--reader-share-option-size);
            max-width: var(--reader-share-option-size);
            height: var(--reader-share-option-size);
            min-height: var(--reader-share-option-size);
            max-height: var(--reader-share-option-size);
            inline-size: var(--reader-share-option-size);
            min-inline-size: var(--reader-share-option-size);
            max-inline-size: var(--reader-share-option-size);
            block-size: var(--reader-share-option-size);
            min-block-size: var(--reader-share-option-size);
            max-block-size: var(--reader-share-option-size);
            border-radius: var(--control-radius);
          }
          :root body .header-controls .share-menu[open] { z-index: 100; }
          :root[dir="ltr"] body .header-controls .share-menu > .share-options,
          :root[dir="ltr"] body .header-controls .share-menu[data-share-side="above"] > .share-options {
            position: absolute !important;
            left: auto !important;
            right: calc(100% + var(--reader-share-gap)) !important;
            top: 0 !important;
            bottom: auto !important;
          }
          :root[dir="rtl"] body .header-controls .share-menu > .share-options,
          :root[dir="rtl"] body .header-controls .share-menu[data-share-side="above"] > .share-options {
            position: absolute !important;
            right: auto !important;
            left: calc(100% + var(--reader-share-gap)) !important;
            top: 0 !important;
            bottom: auto !important;
          }
          :root body .header-controls .share-menu > .share-options,
          :root body .header-controls .share-menu[data-share-side="above"] > .share-options {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            width: max-content;
            max-width: none;
            gap: var(--reader-share-gap);
            padding: 0;
            border-radius: var(--control-radius);
            transform: none !important;
            translate: none !important;
          }
          :root body .header-controls .share-menu > .share-options > :is(a, button) {
            padding: var(--control-padding);
          }
          :root body .header-controls .share-menu > .share-options > :is(a, button) > svg {
            width: var(--reader-share-icon-size);
            height: var(--reader-share-icon-size);
          }
          '''
          if marker not in css:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'
          path.write_text(css)

          digest = hashlib.sha256(path.read_bytes()).hexdigest()[:12]
          pattern = re.compile(r'((?:/ssm)?/assets/post-layout\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = pattern.sub(rf'\1?v={digest}', text)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          final = path.read_text()
          for required in (
              marker,
              '--reader-share-option-size: var(--control-size);',
              'right: calc(100% + var(--reader-share-gap)) !important;',
              'left: calc(100% + var(--reader-share-gap)) !important;',
              'transform: none !important;',
              'translate: none !important;',
          ):
              if required not in final:
                  raise SystemExit(f'Missing reader share anchor rule: {required}')

          sample = Path('en/index.html').read_text()
          if not re.search(rf'(?:/ssm)?/assets/post-layout\.css\?v={digest}', sample):
              raise SystemExit('Homepage did not receive refreshed post-layout stylesheet hash')
          print(f'Updated {changed} HTML files; post-layout={digest}')
          PY
            git add assets/post-layout.css '*.html' 'en/**/*.html' 'he/**/*.html'
            if git diff --cached --quiet; then
              echo "Live reader share anchor is already current."
              exit 0
            fi
            git commit -m "Anchor reader share destinations beside Share"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent Pages update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
