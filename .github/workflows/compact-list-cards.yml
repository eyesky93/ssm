name: Compact list cards

on:
  push:
    paths:
      - '.github/workflows/compact-list-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact list-card geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          css_path = Path('assets/control-sizing.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* compact-list-cards-v1 */'
          rules = base64.b64decode('').decode('utf-8')
          if marker not in css:
              css += rules
              css_path.write_text(css, encoding='utf-8')

          version = hashlib.sha256(css.encode()).hexdigest()[:12]
          pattern = re.compile(r'(assets/control-sizing\.css)\?v=[0-9a-f]+')
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = pattern.sub(rf'\1?v={version}', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/compact-list-cards.yml').unlink()
          print(version)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Compact list cards without shrinking actions'
          git push
