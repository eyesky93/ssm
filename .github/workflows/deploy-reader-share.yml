name: Deploy compact reader share

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-reader-share.yml"

permissions:
  contents: write

concurrency:
  group: ssm-reader-share-presentation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current Pages tree and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          control_path = Path('assets/control-sizing.css')
          control_css = control_path.read_text()
          control_marker = '/* global-share-control-size-v1 */'
          control_block = r'''
          /* global-share-control-size-v1 */
          /* Use the current reader Share box as the one global framed-control
             size. Tags and the formerly compact toolbar consume the same token. */
          :root {
            --control-size: 1.9575rem;
            --tag-capsule-size: var(--control-size);
            --compact-control-size: var(--control-size);
          }
          '''
          if control_marker not in control_css:
              control_css = control_css.rstrip() + '\n\n' + control_block.strip() + '\n'
          control_path.write_text(control_css)

          post_path = Path('assets/post-layout.css')
          post_css = post_path.read_text()
          post_marker = '/* reader-share-direct-left-v3 */'
          post_block = r'''
          /* reader-share-direct-left-v3 */
          /* Share destinations are identical to the Share trigger and begin
             directly at its inline-start side: left in LTR, right in RTL. */
          :root {
            --reader-share-option-size: var(--header-control-size);
            --reader-share-icon-size: var(--control-icon-size);
            --reader-share-gap: var(--header-control-gap);
            --reader-share-padding: 0;
          }
          :root body .header-controls .share-menu > summary,
          :root body .header-controls .share-menu > .share-options > :is(a, button) {
            box-sizing: border-box;
            flex: 0 0 var(--reader-share-option-size);
            width: var(--reader-share-option-size);
            min-width: var(--reader-share-option-size);
            max-width: var(--reader-share-option-size);
            height: var(--reader-share-option-size);
            min-height: var(--reader-share-option-size);
            max-height: var(--reader-share-option-size);
            inline-size: var(--reader-share-option-size);
            min-inline-size: var(--reader-share-option-size);
            max-inline-size: var(--reader-share-option-size);
            block-size: var(--reader-share-option-size);
            min-block-size: var(--reader-share-option-size);
            max-block-size: var(--reader-share-option-size);
            border-radius: var(--control-radius);
          }
          :root body .header-controls .share-menu[open] { z-index: 100; }
          :root body .header-controls .share-menu > .share-options,
          :root body .header-controls .share-menu[data-share-side="above"] > .share-options {
            inset-inline-start: auto;
            inset-inline-end: calc(100% + var(--reader-share-gap));
            inset-block-start: 0;
            inset-block-end: auto;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-end;
            width: max-content;
            max-width: none;
            gap: var(--reader-share-gap);
            padding: 0;
            border-radius: var(--control-radius);
            translate: none !important;
          }
          :root body .header-controls .share-menu > .share-options > :is(a, button) {
            padding: var(--control-padding);
          }
          :root body .header-controls .share-menu > .share-options > :is(a, button) > svg {
            width: var(--reader-share-icon-size);
            height: var(--reader-share-icon-size);
          }
          '''
          if post_marker not in post_css:
              post_css = post_css.rstrip() + '\n\n' + post_block.strip() + '\n'
          post_path.write_text(post_css)

          control_digest = hashlib.sha256(control_path.read_bytes()).hexdigest()[:12]
          post_digest = hashlib.sha256(post_path.read_bytes()).hexdigest()[:12]
          control_pattern = re.compile(r'((?:/ssm)?/assets/control-sizing\.css)\?v=[0-9a-f]+')
          post_pattern = re.compile(r'((?:/ssm)?/assets/post-layout\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = control_pattern.sub(rf'\1?v={control_digest}', text)
              updated = post_pattern.sub(rf'\1?v={post_digest}', updated)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          final_control = control_path.read_text()
          for required in (
              control_marker,
              '--control-size: 1.9575rem;',
              '--tag-capsule-size: var(--control-size);',
              '--compact-control-size: var(--control-size);',
          ):
              if required not in final_control:
                  raise SystemExit(f'Missing global control rule: {required}')

          final_post = post_path.read_text()
          for required in (
              post_marker,
              '--reader-share-option-size: var(--header-control-size);',
              'inset-inline-end: calc(100% + var(--reader-share-gap));',
              'padding: 0;',
              'translate: none !important;',
              '.share-menu[open] { z-index: 100; }',
          ):
              if required not in final_post:
                  raise SystemExit(f'Missing reader share rule: {required}')

          sample = Path('en/index.html').read_text()
          if not re.search(rf'(?:/ssm)?/assets/control-sizing\.css\?v={control_digest}', sample):
              raise SystemExit('Homepage did not receive refreshed control stylesheet hash')
          if not re.search(rf'(?:/ssm)?/assets/post-layout\.css\?v={post_digest}', sample):
              raise SystemExit('Homepage did not receive refreshed post-layout stylesheet hash')
          print(f'Updated {changed} HTML files; control-sizing={control_digest}; post-layout={post_digest}')
          PY
            git add assets/control-sizing.css assets/post-layout.css '*.html' 'en/**/*.html' 'he/**/*.html'
            if git diff --cached --quiet; then
              echo "Live global controls and reader share are already current."
              exit 0
            fi
            git commit -m "Publish global Share-sized controls"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent Pages update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
