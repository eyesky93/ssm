name: Repair post layout spacing

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/repair-post-layout-spacing.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair all post layout spacing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          import hashlib, re

          spacing = Path('assets/control-spacing.css')
          css = spacing.read_text()

          # Remove the list-card structural rewrite that changed the card itself
          # into a two-column grid. The original card/footer model must own layout.
          css = re.sub(
              r'\n?/\* compact-list-card-content-grid-v1 \*/.*\Z',
              '\n',
              css,
              flags=re.S,
          ).rstrip() + '\n'

          marker = '/* post-layout-spacing-contract-v2 */'
          if marker in css:
              css = css[:css.index(marker)].rstrip() + '\n'

          block = r'''
          /* post-layout-spacing-contract-v2 */
          /* One geometry contract for list/grid/compact. Row spacing reserves the
             detached engagement tabs; column density is independent. */
          :root {
            --post-stream-row-gap: calc(var(--engagement-tab-height, 2rem) + var(--interface-edge-gap));
            --post-stream-column-gap: 1rem;
            --post-stream-compact-column-gap: .75rem;
          }
          :root body .post-stream {
            --active-post-stream-column-gap: var(--post-stream-column-gap);
            row-gap: var(--post-stream-row-gap);
            column-gap: var(--active-post-stream-column-gap);
          }
          :root body .post-stream[data-layout="compact"] {
            --active-post-stream-column-gap: var(--post-stream-compact-column-gap);
          }

          /* Directory has no detached stats strip. Remove only that unused reserve
             so Directory -> first post keeps the small shared interface gap. */
          :root body .post-stream[data-layout="list"] > .directory-card:not([hidden]),
          :root body .post-stream:is([data-layout="grid"], [data-layout="compact"]) > .directory-card:not([hidden]):has([data-pin-toggle][aria-pressed="true"]) {
            margin-block-end: calc(var(--interface-edge-gap) - var(--post-stream-row-gap));
          }

          /* Actions are one compact footer row in every homepage layout. They do
             not create a second card column or a tall vertical action lane. */
          :root body .post-stream[data-layout] [data-card-actions] {
            position: static;
            display: inline-flex;
            flex: 0 0 auto;
            flex-flow: row nowrap;
            align-items: center;
            align-self: end;
            justify-content: flex-end;
            gap: var(--quiet-control-gap);
            width: auto;
            max-width: none;
            margin: 0;
          }
          :root body .post-stream[data-layout] [data-card-actions] > .read-toggle { order: 1; }
          :root body .post-stream[data-layout] [data-card-actions] > .card-share-menu { order: 2; }
          :root body .post-stream[data-layout] [data-card-actions] > .pin-toggle { order: 3; }

          :root body .post-stream[data-layout] .card-footer:has(> [data-card-actions]) {
            display: grid;
            grid-template-columns: minmax(0, 1fr) max-content;
            align-items: end;
            column-gap: var(--control-capsule-gap);
          }
          :root body .post-stream[data-layout] .card-footer:has(> [data-card-actions]) > time {
            grid-area: 1 / 1;
            align-self: end;
            padding-block-end: 0;
          }
          :root body .post-stream[data-layout] .card-footer > [data-card-actions] {
            grid-area: 1 / 2;
            justify-self: end;
            margin-inline-end: calc(var(--card-action-inset) - var(--post-card-padding-inline));
            margin-block-end: calc(var(--card-action-inset) - var(--post-card-padding-block));
          }
          :root body .post-stream[data-layout="list"] .card-footer {
            margin-block-start: var(--control-item-gap);
            padding-block-start: 0;
          }
          :root body .post-stream[data-layout] .directory-heading > [data-card-actions] {
            align-self: center;
            justify-content: center;
          }
          '''
          spacing.write_text(css.rstrip() + '\n\n' + block.strip() + '\n')

          # Cache-bust the imported spacing asset, then cache-bust styles.css itself
          # on every generated page.
          spacing_digest = hashlib.sha256(spacing.read_bytes()).hexdigest()[:12]
          styles = Path('assets/styles.css')
          styles_text = styles.read_text()
          styles_text = re.sub(
              r'@import url\("\./control-spacing\.css(?:\?v=[0-9a-f]+)?"\);',
              f'@import url("./control-spacing.css?v={spacing_digest}");',
              styles_text,
              count=1,
          )
          styles.write_text(styles_text)
          styles_digest = hashlib.sha256(styles.read_bytes()).hexdigest()[:12]

          pattern = re.compile(r'(/ssm/assets/styles\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = pattern.sub(rf'\1?v={styles_digest}', text)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          final = spacing.read_text()
          required = (
              marker,
              '--post-stream-row-gap:',
              'row-gap: var(--post-stream-row-gap);',
              'column-gap: var(--active-post-stream-column-gap);',
              'flex-flow: row nowrap;',
              'grid-template-columns: minmax(0, 1fr) max-content;',
          )
          for item in required:
              if item not in final:
                  raise SystemExit(f'Missing repaired layout rule: {item}')
          if 'compact-list-card-content-grid-v1' in final:
              raise SystemExit('Obsolete list-card grid rewrite still present')
          if 'grid-template-areas:' in final:
              raise SystemExit('Obsolete card-level grid geometry still present')
          sample = Path('en/index.html').read_text()
          if f'/ssm/assets/styles.css?v={styles_digest}' not in sample:
              raise SystemExit('Homepage did not receive refreshed styles hash')
          print(f'Updated {changed} HTML files; spacing={spacing_digest}; styles={styles_digest}')
          PY
            git add assets/control-spacing.css assets/styles.css '*.html' 'en/**/*.html' 'he/**/*.html'
            if git diff --cached --quiet; then
              echo "Live site already current."
              exit 0
            fi
            git commit -m "Repair list grid and detached engagement spacing"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent Pages update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
