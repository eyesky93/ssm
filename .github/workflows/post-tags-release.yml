name: Prepare verified post-tag release
on:
  push:
    branches: [validation/post-tags-release-20260917]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out only the current generated public site
        uses: actions/checkout@v7
        with:
          ref: 5ac9ee3de5a8327965adf6a537b93c5c551d7cd9
          fetch-depth: 1
      - name: Generate the verified reader layout without changing public data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5ac9ee3de5a8327965adf6a537b93c5c551d7cd9
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          CSS = '''
          /* The initial reader render moves the original tag row below the complete
             article body and removes its empty tools wrapper. Reclaim that title track;
             legacy/partial markup with real header tools retains its containment above. */
          :root .article-heading.post-heading:not(:has(> .post-tools)) {
            display: block;
          }
          :root .article-heading.post-heading:not(:has(> .post-tools)) > h1 {
            width: 100%;
          }
          /* Reuse the shared tag row, capsule geometry and logical end alignment. The
             body already reserves space for its attached engagement strip. */
          :root [data-reader-article]:not([data-directory]) > .article-tags {
            width: 100%;
            max-width: 100%;
            margin: 0;
            margin-block-end: var(--surface-padding);
          }
          [data-reader-article] > .article-body:has(> .article-end-engagement-dock) + .article-tags + .comments-shell {
            border-block-start: 0;
          }
          '''

          # This temporary job reads only already-public generated files. Its
          # result must match the locally browser-validated release byte-for-byte.
          TOKENS = re.compile(r'''<!--[\s\S]*?-->|<(script|style|textarea)\b[^>]*>[\s\S]*?</\1\s*>|</?div\b(?:"[^"]*"|'[^']*'|[^'">])*>''', re.I)

          def div_range(markup, class_name, start=0):
              first = None
              depth = 0
              for match in TOKENS.finditer(markup, start):
                  token = match[0]
                  if not re.match(r'</?div\b', token, re.I):
                      continue
                  closing = token.startswith('</')
                  if first is None:
                      classes = re.search(r'''\bclass\s*=\s*(?:"([^"]*)"|'([^']*)')''', token, re.I)
                      names = ((classes[1] or classes[2]) if classes else '').split()
                      if closing or class_name not in names:
                          continue
                      first = (match.start(), match.end())
                  depth += -1 if closing else 1
                  if depth == 0:
                      return (*first, match.start(), match.end())
              if first:
                  raise ValueError(f'Unclosed {class_name}')
              return None

          def place_article(match):
              article = match[0]
              if re.match(r'<article\b[^>]*\bdata-directory(?:\s|=|>)', article):
                  return article
              header_end = article.find('</header>')
              if header_end < 0:
                  return article
              header = article[:header_end]
              tags = div_range(header, 'article-tags')
              body = div_range(article, 'article-body', header_end)
              if not tags or not body:
                  return article
              row = article[tags[0]:tags[3]] if article[tags[1]:tags[2]].strip() else ''
              header = header[:tags[0]] + header[tags[3]:]
              header = re.sub(r'<div\b(?=[^>]*\bclass="[^"]*\bpost-tools\b)[^>]*>\s*</div>', '', header)
              return header + article[header_end:body[3]] + row + article[body[3]:]

          root = Path('.')
          stylesheet = root / 'assets/post-layout.css'
          css = stylesheet.read_text(encoding='utf-8') + CSS
          stylesheet.write_text(css, encoding='utf-8', newline='')
          version = hashlib.sha256(css.encode()).hexdigest()[:12]
          assert version == 'a6ddefa53cdf', version
          moved = changed = 0
          for path in sorted(root.rglob('*.html')):
              if '.git' in path.parts:
                  continue
              before = path.read_text(encoding='utf-8')
              after = re.sub(r'<article\b(?=[^>]*\bdata-reader-article(?:\s|=|>))[^>]*>[\s\S]*?</article>', place_article, before)
              moved += after != before
              after = re.sub(r'(/assets/post-layout\.css\?v=)[^"<>]*', lambda m: m[1] + version, after)
              if after != before:
                  path.write_text(after, encoding='utf-8', newline='')
                  changed += 1
          assert (moved, changed) == (18, 48), (moved, changed)
          paths = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert len(paths) == 49, paths
          manifest = ''
          for name in paths:
              assert name.endswith('.html') or name == 'assets/post-layout.css', name
              data = Path(name).read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              manifest += name + '\t' + blob + '\n'
          digest = hashlib.sha256(manifest.encode()).hexdigest()
          assert digest == 'e9cb449c45983b204c0c3c12b92c42517ff1c2a803e9532c77c0e3482375610f', digest
          assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).strip()
          print('Verified 18 reader updates and all 49 public output hashes against the locally tested release.')
          PY
      - name: Stage only the generated result on a separate release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git diff --cached --check
          git commit -m 'Publish verified post-page tags below article content'
          git push origin HEAD:refs/heads/release/post-tags-20260917
          echo "Prepared generated commit $(git rev-parse HEAD). Master and Pages configuration are unchanged."
