name: Deploy measured settings alignment

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-measured-settings-alignment.yml"

permissions:
  contents: write

concurrency:
  group: ssm-measured-settings-alignment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch live settings geometry and refresh hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import hashlib
          import re

          site_path = Path('assets/site.js')
          site = site_path.read_text()
          settings_anchor = (
              'const settings = document.querySelector("[data-header-settings]");\n'
              'const settingsToggle = settings?.querySelector("[data-settings-toggle]");\n'
              'const popupMenus = "[data-share-menu][open], [data-color-menu][open], [data-view-menu][open]";\n'
          )
          geometry_code = dedent('''\

          class HeaderSettingsGeometry {
            constructor(settings, toggle) {
              this.settings = settings;
              this.toggle = toggle;
              this.controls = settings?.querySelector(".header-actions");
              this.mobile = window.matchMedia("(max-width: 700px)");
            }

            alignColumns() {
              if (!this.controls || !this.toggle || !this.mobile.matches) {
                this.clear();
                return false;
              }
              const compact = document.querySelector('.header-controls .toolbar-view .view-switch > [data-view="compact"]');
              const language = document.querySelector('.header-controls > .language-nav > :is(a, select)');
              if (!compact || !language) {
                this.clear();
                return false;
              }

              const compactRect = compact.getBoundingClientRect();
              const languageRect = language.getBoundingClientRect();
              const settingsRect = this.toggle.getBoundingClientRect();
              if (!compactRect.width || !languageRect.width || !settingsRect.width) {
                this.clear();
                return false;
              }

              const center = rect => rect.left + rect.width / 2;
              const cell = settingsRect.width;
              const compactLanguageGap = Math.max(0, Math.abs(center(languageRect) - center(compactRect)) - cell);
              const languageSettingsGap = Math.max(0, Math.abs(center(settingsRect) - center(languageRect)) - cell);
              const rowGap = (compactLanguageGap + languageSettingsGap) / 2;
              const gridWidth = 3 * cell + compactLanguageGap + languageSettingsGap;

              this.controls.style.setProperty("--settings-cell", `${cell}px`);
              this.controls.style.setProperty("--settings-gap-compact-language", `${compactLanguageGap}px`);
              this.controls.style.setProperty("--settings-gap-language-settings", `${languageSettingsGap}px`);
              this.controls.style.setProperty("--settings-row-gap", `${rowGap}px`);
              this.controls.style.setProperty("--settings-grid-inline-size", `${gridWidth}px`);
              this.controls.dataset.settingsColumnsAligned = "true";
              return true;
            }

            clear() {
              if (!this.controls) return;
              for (const name of [
                "--settings-cell",
                "--settings-gap-compact-language",
                "--settings-gap-language-settings",
                "--settings-row-gap",
                "--settings-grid-inline-size",
              ]) this.controls.style.removeProperty(name);
              delete this.controls.dataset.settingsColumnsAligned;
            }
          }

          const settingsGeometry = settings && settingsToggle ? new HeaderSettingsGeometry(settings, settingsToggle) : null;
          ''')
          if 'class HeaderSettingsGeometry' not in site:
              if settings_anchor not in site:
                  raise SystemExit('settings anchor not found in live site.js')
              site = site.replace(settings_anchor, settings_anchor + geometry_code, 1)

          open_anchor = '  else {\n    settings.querySelectorAll("[data-color-menu], [data-view-menu]").forEach((menu) => {\n'
          open_replacement = '  else {\n    settingsGeometry?.alignColumns();\n    settings.querySelectorAll("[data-color-menu], [data-view-menu]").forEach((menu) => {\n'
          if 'settingsGeometry?.alignColumns();' not in site:
              if open_anchor not in site:
                  raise SystemExit('settings open anchor not found in live site.js')
              site = site.replace(open_anchor, open_replacement, 1)
          site_path.write_text(site)

          css_path = Path('assets/control-sizing.css')
          css = css_path.read_text()
          marker = '/* mobile-settings-measured-grid-v6 */'
          css_block = dedent(r'''

          /* mobile-settings-measured-grid-v6 */
          /* The box and internal columns use the actual rendered header geometry,
             measured immediately before the popup opens. */
          @media (max-width: 700px) {
            :root body .header-settings .header-actions[data-settings-columns-aligned="true"] {
              inline-size: calc(var(--settings-grid-inline-size) + var(--settings-padding) + var(--settings-padding)) !important;
            }
            :root body .header-settings .header-actions[data-settings-columns-aligned="true"] .settings-lower {
              grid-template-columns:
                var(--settings-cell)
                var(--settings-gap-compact-language)
                var(--settings-cell)
                var(--settings-gap-language-settings)
                var(--settings-cell) !important;
              grid-template-rows: repeat(2, var(--settings-cell)) !important;
              column-gap: 0 !important;
              row-gap: var(--settings-row-gap) !important;
              inline-size: var(--settings-grid-inline-size) !important;
              block-size: auto !important;
              direction: inherit;
            }
            :root body .header-settings .header-actions[data-settings-columns-aligned="true"] .settings-lower > .updates-controls > :first-child { grid-column: 1; }
            :root body .header-settings .header-actions[data-settings-columns-aligned="true"] .settings-lower > .updates-controls > :nth-child(2) { grid-column: 3; }
            :root body .header-settings .header-actions[data-settings-columns-aligned="true"] .settings-lower > .random-post { grid-column: 1; }
            :root body .header-settings .header-actions[data-settings-columns-aligned="true"] .settings-lower > .theme-toggle { grid-column: 3; }
            :root body .header-settings .header-actions[data-settings-columns-aligned="true"] .settings-lower > .color-settings {
              grid-column: 5;
              inline-size: var(--settings-cell) !important;
              width: var(--settings-cell) !important;
            }
            :root body .header-settings .header-actions[data-settings-columns-aligned="true"] .accent-panel {
              grid-template-rows: repeat(2, var(--settings-cell)) !important;
              gap: var(--settings-row-gap) !important;
            }
          }
          ''')
          if marker not in css:
              css = css.rstrip() + css_block + '\n'
          css_path.write_text(css)

          # Validate the measured-grid math against the user's screenshot geometry:
          # compact/language/settings centers are separated by ~92 px while the
          # old popup step was ~88 px. The measured formula must reproduce all
          # three anchor centers exactly instead of accumulating leftward drift.
          compact_center, language_center, settings_center = 383.5, 475.5, 567.5
          cell = 76.0
          gap1 = abs(language_center - compact_center) - cell
          gap2 = abs(settings_center - language_center) - cell
          right_center = settings_center
          middle_center = right_center - (cell + gap2)
          left_center = middle_center - (cell + gap1)
          assert abs(left_center - compact_center) < 1e-9
          assert abs(middle_center - language_center) < 1e-9
          assert abs(right_center - settings_center) < 1e-9

          site_digest = hashlib.sha256(site_path.read_bytes()).hexdigest()[:12]
          css_digest = hashlib.sha256(css_path.read_bytes()).hexdigest()[:12]
          site_pattern = re.compile(r'(/ssm/assets/site\.js)\?v=[0-9a-f]+')
          css_pattern = re.compile(r'(/ssm/assets/control-sizing\.css)\?v=[0-9a-f]+')
          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text()
              updated = site_pattern.sub(rf'\1?v={site_digest}', text)
              updated = css_pattern.sub(rf'\1?v={css_digest}', updated)
              if updated != text:
                  html.write_text(updated)
                  changed += 1

          sample = Path('en/index.html').read_text()
          if f'/ssm/assets/site.js?v={site_digest}' not in sample:
              raise SystemExit('homepage site.js hash not refreshed')
          if f'/ssm/assets/control-sizing.css?v={css_digest}' not in sample:
              raise SystemExit('homepage control-sizing hash not refreshed')
          if 'class HeaderSettingsGeometry' not in site_path.read_text():
              raise SystemExit('measured geometry code missing after patch')
          if marker not in css_path.read_text():
              raise SystemExit('measured geometry CSS missing after patch')
          print(f'Updated {changed} HTML files; site={site_digest}; controls={css_digest}')
          PY
            node --check assets/site.js
            git add --all
            if git diff --cached --quiet; then
              echo "Live site already current."
              exit 0
            fi
            git commit -m "Publish measured settings alignment"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/3)."
            sleep 2
          done
          exit 1
