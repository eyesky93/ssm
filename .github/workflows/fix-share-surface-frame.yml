name: Fix share surface frame

on:
  push:
    paths:
      - '.github/workflows/fix-share-surface-frame.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared global share surface and frame
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64;exec(base64.b64decode(''))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Match share surface to card and add global frame'
          git push
