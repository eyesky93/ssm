name: Deploy shared framed controls

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/one-shot-framed-controls-live.yml"
      - "framed-controls-hotfix.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: true

      - name: Apply framed-control class to generated site
        run: python framed-controls-hotfix.py

      - name: Commit live patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use shared framed-control class on live header"
          git pull --rebase origin master
          git push origin HEAD:master
