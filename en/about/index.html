<script data-home-first-paint data-home-state-scripts="[&quot;site&quot;,&quot;pins&quot;,&quot;post-browser&quot;,&quot;read-status&quot;,&quot;post-votes&quot;]">// Installed before the first paint of home, grid, reader, About and Directory
// pages. The historical data-home-* attributes remain a single shared gate.
// Offline owner editions retain their own startup and make no new requests.
(() => {
  if (window.location.protocol === "file:") return;
  const root = document.documentElement;
  const pending = new Set(JSON.parse(document.currentScript?.dataset.homeStateScripts || "[]"));
  let released = false;
  let settling = false;
  let timer;

  function reveal() {
    if (released) return;
    released = true;
    window.clearTimeout(timer);
    root.removeAttribute("data-home-starting");
    document.removeEventListener("load", scriptFinished, true);
    document.removeEventListener("error", scriptFinished, true);
    document.removeEventListener("DOMContentLoaded", settle);
    window.removeEventListener("pageshow", restorePage);
  }

  function settle() {
    if (released || settling || pending.size || !document.body) return;
    settling = true;
    // Visibility, unlike display:none, preserves layout and starts used fonts.
    // Flush the restored layout before reading the FontFaceSet's ready promise.
    document.body.getBoundingClientRect();
    Promise.resolve(document.fonts?.ready).catch(() => {}).then(() => {
      if (released) return;
      // Let existing ResizeObservers/tag-row and Directory measurements settle
      // at the saved scale and final font metrics before revealing any controls.
      window.requestAnimationFrame(() => window.requestAnimationFrame(reveal));
    });
  }

  function scriptFinished(event) {
    const name = event.target?.getAttribute?.("data-home-state-script");
    if (pending.delete(name)) settle();
  }

  function restorePage(event) {
    if (event.persisted) reveal(); // Never hide a restored back/forward snapshot.
  }

  document.addEventListener("load", scriptFinished, true);
  document.addEventListener("error", scriptFinished, true);
  document.addEventListener("DOMContentLoaded", settle);
  window.addEventListener("pageshow", restorePage);
  // Failure/blocked-resource escape hatch, not a minimum display delay. Ready
  // pages reveal immediately; analytics, votes and comments responses never gate it.
  timer = window.setTimeout(reveal, 2000);
  root.setAttribute("data-home-starting", "");
})();
</script>

<script data-home-appearance-src="/ssm/assets/appearance.js?v=25360c8c4306">(() => {

  function mix(from, to, weight) {
    const channels = [1, 3, 5].map((offset) => Math.round(
      parseInt(from.slice(offset, offset + 2), 16) * (1 - weight) +
      parseInt(to.slice(offset, offset + 2), 16) * weight,
    ).toString(16).padStart(2, "0"));
